<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Repêchage en cours – Fantazy</title>
  <script src="theme.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <!-- Chiffres en monospace, comme le `font-stats-numeric` du gabarit :
       les colonnes de statistiques s'alignent et se comparent mieux. -->
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <!-- Ordre volontaire : index.css fournit les jetons et les styles de base,
       navbar.css la barre, puis draftActif.css spécialise la page. Charger
       draftActif.css en dernier évite d'avoir à recourir à !important. -->
  <link rel="stylesheet" href="index.css" />
  <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="poolNav.css">
  <link rel="stylesheet" href="skeleton-loader.css" />
  <link rel="stylesheet" href="draftActif.css" />
  <!-- Modale de carrière : feuille partagée avec stats.html, chargée en
       dernier pour spécialiser sans !important. -->
  <link rel="stylesheet" href="career-modal.css" />
  <script defer src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="icons.js" defer></script>

  <!-- ?pool= est lu ici, avant activePool.js : ce script nettoie l'URL, et
       le contexte n'y retrouverait plus le paramètre ensuite. Les deux clés
       sont donc écrites d'un coup, sinon le rail afficherait un pool et la
       salle de repêchage en ouvrirait un autre. -->
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const poolParam = urlParams.get('pool');
    if (poolParam) {
      localStorage.setItem('draftClan', poolParam);
      localStorage.setItem('activePool', poolParam);
      window.history.replaceState({}, document.title, window.location.pathname);
    }
  </script>
    <!-- Contexte de pool actif : doit precéder tout script de page. -->
    <script defer src="activePool.js"></script>
</head>
<body>
  <nav class="navbar">
    <!-- Navbar content will be generated by navbar.js -->
  </nav>

  <!-- Draft Header with Pick Number -->
  <div class="draft-header">
    <!-- Overall draft progress (Goal-Gradient + Mental Model) -->
    <div class="draft-overall-progress" id="draft-overall-progress" style="display:none;">
      <div class="dop-info">
        <span id="dop-label">Choix 1 / 1</span>
        <!-- État du tour placé au centre de la barre de progression. Sa
             visibilité suit désormais celle du bloc : les deux dépendent de
             la présence d'un ordre de repêchage, donc ils apparaissent et
             disparaissent ensemble. -->
        <div id="turn-banner" class="turn-banner"></div>
        <span id="dop-round">Ronde 1</span>
      </div>
    </div>

    <!-- Derniers choix : remonté ici pour former le bandeau collant du
         gabarit, visible pendant qu'on parcourt la liste de joueurs.
         Le bloc est déplacé tel quel — draftActif.js cible #picks-carousel,
         #carousel-prev et #carousel-next par identifiant, la position dans
         le document ne change donc rien pour lui. -->
    <div class="recent-picks-card">
      <div class="card-header">
        <h3>Derniers choix</h3>
        <div class="carousel-controls">
          <button class="carousel-btn" id="carousel-prev">‹</button>
          <button class="carousel-btn" id="carousel-next">›</button>
        </div>
      </div>
      <div class="picks-carousel" id="picks-carousel">
        <!-- Recent picks will be displayed here -->
      </div>
    </div>
  </div>

  <!-- Draft Status & Progress -->
  <div class="draft-main-container">

    <!-- Left Column: Draft Order & Progress -->
    <div class="draft-sidebar">

      <!-- Your Progress -->
      <div class="progress-card">
        <div class="progress-header">
          <h3>Ma progression</h3>
          <!-- Conservé pour la liaison de draftActif.js, mais masqué : le choix
               se fait désormais en cliquant une position. -->
          <select id="progressFilter" class="progress-filter-select" hidden>
            <option value="">Voir détails...</option>
            <option value="offensive">Attaquants</option>
            <option value="defensive">Défenseurs</option>
            <option value="rookie">Recrues</option>
            <option value="goalie">Gardien</option>
            <option value="team">Équipe</option>
          </select>
        </div>
        <div id="progressDetailsList" class="progress-details-list" style="display: none;">
          <!-- Player list will be populated here -->
        </div>
        <div class="progress-list">
          <div class="progress-line" data-position="offensive" role="button" tabindex="0"
               aria-expanded="false" title="Voir les joueurs choisis">
            <span class="progress-emoji" data-icon="bolt" data-icon-size="16"></span>
            <span class="progress-text">Attaquants</span>
            <div class="progress-mini-bar">
              <div class="progress-mini-fill" id="mini-progress-offensive"></div>
            </div>
            <span class="progress-value" id="count-offensive">0/6</span>
          </div>
          <div class="progress-line" data-position="defensive" role="button" tabindex="0"
               aria-expanded="false" title="Voir les joueurs choisis">
            <span class="progress-emoji" data-icon="shield" data-icon-size="16"></span>
            <span class="progress-text">Défenseurs</span>
            <div class="progress-mini-bar">
              <div class="progress-mini-fill" id="mini-progress-defensive"></div>
            </div>
            <span class="progress-value" id="count-defensive">0/4</span>
          </div>
          <div class="progress-line" data-position="rookie" role="button" tabindex="0"
               aria-expanded="false" title="Voir les joueurs choisis">
            <span class="progress-emoji" data-icon="star" data-icon-size="16"></span>
            <span class="progress-text">Recrues</span>
            <div class="progress-mini-bar">
              <div class="progress-mini-fill" id="mini-progress-rookie"></div>
            </div>
            <span class="progress-value" id="count-rookie">0/1</span>
          </div>
          <div class="progress-line" data-position="goalie" role="button" tabindex="0"
               aria-expanded="false" title="Voir les joueurs choisis">
            <span class="progress-emoji" data-icon="goal" data-icon-size="16"></span>
            <span class="progress-text">Gardien</span>
            <div class="progress-mini-bar">
              <div class="progress-mini-fill" id="mini-progress-goalie"></div>
            </div>
            <span class="progress-value" id="count-goalie">0/1</span>
          </div>
          <div class="progress-line" data-position="team" role="button" tabindex="0"
               aria-expanded="false" title="Voir les joueurs choisis">
            <span class="progress-emoji" data-icon="hockey" data-icon-size="16"></span>
            <span class="progress-text">Équipe</span>
            <div class="progress-mini-bar">
              <div class="progress-mini-fill" id="mini-progress-team"></div>
            </div>
            <span class="progress-value" id="count-team">0/1</span>
          </div>
        </div>
      </div>

      <!-- Draft Order Timeline -->
      <div class="draft-order-card">
        <h3>Ordre du draft</h3>
        <div id="draft-order-timeline" class="draft-timeline">
          <!-- Timeline items will be injected here -->
        </div>
      </div>

    </div>

    <!-- Center Column: Recent Picks Carousel -->
    <div class="draft-center">

      <!-- Player Selection Area -->
      <div class="player-selection-card">
        <div class="filters-header">
          <h3>Sélection de joueur</h3>
          <!-- Retiré de l'affichage, mais conservé dans le DOM : updateTable()
               lit sa valeur pour écarter les joueurs déjà repêchés. Sans lui,
               $("#availabilityFilter").val() vaut undefined et la liste
               « Tous » passait de 49 à 501 joueurs (mesuré). Figé sur
               « available », le comportement par défaut est préservé. -->
          <select id="availabilityFilter" class="filter-select is-replaced" hidden>
            <option value="available" selected>Disponibles</option>
            <option value="picked">Tous les choix</option>
            <option value="pickedByTeam">Mes choix</option>
          </select>
        </div>

        <!-- Onglets de catégorie : pilotent le <select> #playerFilter existant,
             donc toute la logique de filtrage reste celle de draftActif.js. -->
        <div class="category-tabs" id="categoryTabs" role="tablist" aria-label="Catégorie de joueurs"></div>

        <div class="filters-row">
          <!-- Champ enveloppé pour porter l'icône de loupe du gabarit.
               L'input garde son id : le JS écoute dessus. -->
          <div class="search-field">
            <span class="search-field-icon" data-icon="search" data-icon-size="17"></span>
            <input type="text" id="searchInput" placeholder="Rechercher un joueur..." class="search-input"/>
          </div>
          <select id="playerFilter" class="filter-select">
            <option value="all">Tous</option>
            <option value="offensive">Attaquants</option>
            <option value="defensive">Défenseurs</option>
            <option value="goalies">Gardiens</option>
            <option value="rookies">Recrues</option>
            <option value="teams">Équipes</option>
          </select>
          <select id="sortBy" class="filter-select">
            <option value="points">Points</option>
            <option value="goals">Buts</option>
            <option value="assists">Passes</option>
          </select>
          <button onclick="loadDraftData()" class="refresh-btn" title="Actualiser"><span data-icon="refresh" data-icon-size="16"></span></button>
        </div>

        <div class="table-wrapper">
          <table id="playerTable">
            <thead>
              <tr id="tableHeaderRow">
                <th>Photo</th>
                <th>Joueur</th>
                <th>GP</th>
                <th>G</th>
                <th>A</th>
                <th>PTS</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

    </div>

  </div>

  <div id="loading-container">
    <div id="loading">
      <span class="spinner"></span>
    </div>
  </div>

  <!-- Custom Alert Modal -->
  <div id="customAlertOverlay" class="custom-alert-overlay">
    <div class="custom-alert-box">
      <div class="custom-alert-icon" id="alertIcon"></div>
      <div class="custom-alert-message" id="alertMessage"></div>
      <button class="custom-alert-button" id="alertOkButton">OK</button>
    </div>
  </div>

  <!-- Career Stats Modal - NHL.com Style -->
  <div id="careerStatsModal" class="modal">
    <div class="modal-content career-modal">
      <!-- Career Modal Header with Player Photo -->
      <div class="career-modal-header" id="careerModalHeader" style="display: none;">
        <!-- Classes préfixées « cmh- » : .bio-pill et consorts sont définies
             dans index.css et partagées avec stats.html ; des noms propres à
             cette page évitent de modifier l'autre au passage.
             Tous les id sont conservés : draftActif.js les remplit. -->
        <span class="close-modal" onclick="closeCareerModal()">&times;</span>

        <!-- Identité sur une seule rangée : vignette, nom, jetons, et les
             deux mesures rapides à droite (masquées sous 768px, cf. CSS). -->
        <div class="cmh-identity">
          <div class="player-headshot-container" id="playerHeadshotContainer">
            <div class="no-photo" data-icon="person" data-icon-size="24"></div>
          </div>
          <div class="cmh-ident-text">
            <h2 id="careerPlayerName"></h2>
            <div class="cmh-chips">
              <!-- Pas d'icône ajoutée ici : draftActif.js préfixe déjà la
                   position d'un emoji (« 🏒 D », « 🥅 Gardien de but »). -->
              <span class="cmh-chip"><span id="careerPlayerPosition"></span></span>
              <span class="cmh-chip cmh-chip-team"><span id="careerPlayerTeam"></span></span>
            </div>
          </div>
          <div class="cmh-quick">
            <div class="cmh-quick-item">
              <span class="cmh-mini-lbl">Taille</span>
              <span class="cmh-quick-val" id="playerHeight">-</span>
            </div>
            <div class="cmh-quick-item">
              <span class="cmh-mini-lbl">Poids</span>
              <span class="cmh-quick-val" id="playerWeight">-</span>
            </div>
          </div>
        </div>

        <!-- Informations secondaires en grille dense : deux colonnes sur
             téléphone, quatre au-delà. -->
        <div class="cmh-grid">
          <div class="cmh-cell">
            <span class="cmh-mini-lbl">Né le</span>
            <span class="cmh-cell-val" id="playerBirthDate">-</span>
          </div>
          <div class="cmh-cell">
            <span class="cmh-mini-lbl">Lieu</span>
            <span class="cmh-cell-val" id="playerBirthPlace">-</span>
          </div>
          <div class="cmh-cell">
            <span class="cmh-mini-lbl">Repêchage</span>
            <span class="cmh-cell-val" id="playerDraft">-</span>
          </div>
          <div class="cmh-cell">
            <span class="cmh-mini-lbl">Lance</span>
            <span class="cmh-cell-val" id="playerShoots">-</span>
          </div>
        </div>
      </div>

      <!-- Squelette de chargement, identique à celui de stats.html.
           Il conserve l'id "loadingSpinner" parce que draftActif.js pilote
           l'affichage par cet identifiant : le renommer ferait planter
           l'ouverture de la modale. -->
      <div class="skeleton-loader career-skeleton" id="loadingSpinner">
        <div class="cs-header">
          <div class="cs-identity">
            <div class="skeleton cs-photo"></div>
            <div class="cs-ident-text">
              <div class="skeleton cs-name"></div>
              <div class="cs-chips">
                <div class="skeleton cs-chip"></div>
                <div class="skeleton cs-chip"></div>
              </div>
            </div>
            <div class="cs-quick">
              <div class="skeleton cs-quick-item"></div>
              <div class="skeleton cs-quick-item"></div>
            </div>
          </div>
          <div class="cs-grid">
            <div class="skeleton cs-cell"></div>
            <div class="skeleton cs-cell"></div>
            <div class="skeleton cs-cell"></div>
            <div class="skeleton cs-cell"></div>
          </div>
        </div>
        <div class="cs-filters">
          <div class="skeleton cs-filter"></div>
          <div class="skeleton cs-filter"></div>
        </div>
        <div class="cs-table">
          <div class="cs-thead"></div>
          <div class="cs-row"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <div class="cs-row"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <div class="cs-row"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <div class="cs-row"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <div class="cs-row"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <div class="cs-row"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        </div>
      </div>

      <!-- Career Filters -->
      <div class="career-filters" id="careerFilters" style="display: none;">
        <div class="filter-group-career">
          <label for="leagueFilter">Ligue</label>
          <select id="leagueFilter" onchange="filterCareerStats()">
            <option value="all">Toutes les ligues</option>
            <option value="nhl">NHL seulement</option>
            <option value="other">Autres ligues</option>
          </select>
        </div>
        <div class="filter-group-career">
          <label for="gameTypeFilter">Type de saison</label>
          <select id="gameTypeFilter" onchange="filterCareerStats()">
            <option value="all">Tous</option>
            <option value="regular">Saison régulière</option>
            <option value="playoffs">Playoffs</option>
          </select>
        </div>
        <div class="stats-count-badge" id="statsCountBadge">
          0 saisons affichées
        </div>
      </div>

      <!-- Career Stats Table -->
      <div id="careerStatsTable"></div>
    </div>
  </div>

  <button id="finishButton" class="finish-btn" style="display: none;" onclick="window.location.href='classement.html'">Terminer le draft</button>

  <!-- Load other scripts AFTER jQuery (already loaded in head) -->
  <script defer src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script defer src="avatars.js"></script>
  <script src="headshots.js"></script>
  <script defer src="draftActif.js"></script>
  <!-- Couche d'interface : ne fait que piloter les contrôles déjà en place
       (#playerFilter, showProgressDetails). Aucune logique de repêchage ici. -->
  <script defer src="draftActifUI.js"></script>
  <!-- Logo d'équipe du tableau de carrière, partagé avec stats.html. -->
  <script defer src="careerTeamLogo.js"></script>
  <!-- Alignement de la rangée « Carrière », partagé avec stats.html. -->
  <script defer src="careerTotals.js"></script>
  <script defer src="navbar.js"></script>
  <script defer src="poolNav.js"></script>
  <script defer src="notifications.js"></script>
</body>
</html>
