<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Fantazy</title>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"></script>
    <script defer src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <script defer src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        /* Page sombre seulement (pas de theme.js ici) : les valeurs sombres
           d'index.css — échelle d'Apple et rouge signal. La carte est le
           matériau translucide d'Apple, posé sur un flou de 20px. */
        :root {
            --bg: #000000;
            --card: rgba(28,28,30,0.72);
            --border: #38383A;
            --primary: #E62030;
            --primary-deep: #C41A28;
            --primary-rgb: 230, 32, 48;
            --primary-text: #FF5C66;
            --on-primary: #FFFFFF;
            --danger: var(--primary-text);
            --text: #F5F5F7;
            --text-muted: #A1A1A6;
            --text-hint: #6E6E73;
            --input-bg: #2C2C2E;
            --input-border: #636366;
            --input-focus: rgba(var(--primary-rgb),0.4);
            --success: #30D158;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--text);
            overflow-x: hidden;
        }

        /* Background glow blobs */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
        }
        body::before {
            width: 500px; height: 500px;
            background: rgba(var(--primary-rgb),0.08);
            top: -100px; left: -100px;
        }
        body::after {
            width: 400px; height: 400px;
            background: rgba(var(--primary-rgb),0.08);
            bottom: -80px; right: -80px;
        }

        /* ── Minimal top bar ── */
        .auth-topbar {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 32px;
            border-bottom: 1px solid var(--border);
            background: rgba(22,22,23,0.8);
            backdrop-filter: blur(12px);
        }

        .auth-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .auth-logo:hover { opacity: 0.8; }
        .auth-logo img { height: 32px; width: auto; }
        .auth-logo span {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text);
            letter-spacing: 0.5px;
        }

        .auth-topbar-link {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }
        .auth-topbar-link:hover { color: var(--primary-text); }
        .auth-topbar-link strong { color: var(--primary-text); }

        /* ── Main content ── */
        .auth-main {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
        }

        /* ── Card ── */
        .auth-card {
            width: 100%;
            max-width: 420px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 44px 40px;
            backdrop-filter: blur(20px);
            box-shadow: 0 24px 64px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
            animation: cardIn 0.4s cubic-bezier(0.16,1,0.3,1);
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .card-eyebrow {
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--primary-text);
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text);
            line-height: 1.2;
            margin-bottom: 8px;
        }

        .card-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 32px;
            line-height: 1.5;
        }

        /* ── Form ── */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .form-label {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.3px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            color: var(--text);
            font-size: 0.95rem;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            outline: none;
        }
        .form-input::placeholder { color: var(--text-hint); }
        .form-input:hover { border-color: var(--text-muted); }
        .form-input:focus {
            border-color: var(--primary);
            background: rgba(var(--primary-rgb),0.05);
            box-shadow: 0 0 0 3px var(--input-focus);
        }

        /* ── Messages ── */
        .msg {
            display: none;
            font-size: 0.875rem;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-weight: 500;
        }
        .msg-error {
            background: rgba(var(--primary-rgb),0.12);
            border: 1px solid rgba(var(--primary-rgb),0.35);
            color: var(--danger);
        }
        .msg-success {
            background: rgba(48,209,88,0.12);
            border: 1px solid rgba(48,209,88,0.35);
            color: var(--success);
        }

        /* ── Submit button ── */
        .btn-submit {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            /* Action principale : l'aplat rouge (--primary), libellé blanc
               (--on-primary, 4,55:1), comme partout ailleurs sur le site. */
            background: var(--primary);
            color: var(--on-primary);
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            letter-spacing: 0.3px;
        }
        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            /* Glow is the hover/live signal, not a rest-state halo — matches
               how every other primary button on the site treats it. */
            box-shadow: 0 8px 24px rgba(var(--primary-rgb),0.4);
            background: var(--primary-deep);
        }
        .btn-submit:active:not(:disabled) { transform: translateY(0); }
        .btn-submit:disabled {
            background: #2C2C2E;
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
        }

        /* ── Spinner inside button ── */
        .btn-spinner {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Divider ── */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0 0;
            color: var(--text-muted);
            font-size: 0.82rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider-top { margin: 20px 0; }

        /* ── Google ── thème sombre des consignes de marque Google : fond
           #131314, contour #8E918F, logo « G » en couleurs d'origine. */
        .btn-google {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            background: #131314;
            color: #e3e3e3;
            border: 1px solid #8e918f;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        .btn-google:hover { background: #1e1e21; border-color: #b4b7b5; }
        .btn-google:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--input-focus); }
        .btn-google.is-loading { opacity: 0.7; pointer-events: none; }
        .btn-google svg { width: 18px; height: 18px; flex: none; }

        .signup-link {
            text-align: center;
            margin-top: 24px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .signup-link a {
            color: var(--primary-text);
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        .signup-link a:hover { opacity: 0.8; text-decoration: underline; }

        .consent-note {
            text-align: center;
            margin-top: 18px;
            font-size: 0.78rem;
            line-height: 1.6;
            color: var(--text-muted);
        }
        .consent-note a {
            color: var(--text-muted);
            text-decoration: underline;
            font-weight: 600;
        }
        .consent-note a:hover { color: var(--primary-text); }

        @media (max-width: 480px) {
            .auth-topbar { padding: 14px 20px; }
            .auth-card { padding: 32px 24px; border-radius: 16px; }
            .card-title { font-size: 1.5rem; }
        }
    </style>

    <script>
        const BASE_URL = window.location.hostname.includes("localhost")
            ? "http://localhost:3000"
            : window.location.origin;

        let isSubmitting = false;

        async function login() {
            if (isSubmitting) return;

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            hideMessages();

            if (!username || !password) { showError("Veuillez remplir tous les champs."); return; }
            if (username.length < 3) { showError("Le nom d'utilisateur doit contenir au moins 3 caractères."); return; }
            if (password.length < 4) { showError("Le mot de passe doit contenir au moins 4 caractères."); return; }

            isSubmitting = true;
            const btn = document.getElementById("loginBtn");
            btn.disabled = true;
            btn.innerHTML = '<span class="btn-spinner"></span>Connexion en cours…';

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000);

                const isAdminLogin = username === "admin";
                const endpoint = isAdminLogin ? `${BASE_URL}/admin-login` : `${BASE_URL}/login`;

                const response = await fetch(endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password }),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                const result = await response.json();

                if (response.ok) {
                    localStorage.setItem("isLoggedIn", "true");
                    localStorage.setItem("username", result.username || username);
                    localStorage.setItem("avatarUrl", result.avatarUrl || '');
                    if (isAdminLogin) localStorage.setItem("isAdmin", "true");
                    showSuccess("Connexion réussie ! Redirection…");
                    setTimeout(() => { window.location.href = "index.html"; }, 500);
                } else {
                    showError(result.message || "Identifiants incorrects.");
                }
            } catch (error) {
                if (error.name === 'AbortError') showError("La connexion a pris trop de temps. Réessayez.");
                else if (!navigator.onLine) showError("Pas de connexion internet. Vérifiez votre réseau.");
                else showError("Impossible de joindre le serveur. Réessayez.");
            } finally {
                isSubmitting = false;
                const btn = document.getElementById("loginBtn");
                btn.disabled = false;
                btn.textContent = "Se connecter";
            }
        }

        function hideMessages() {
            document.getElementById("errorMsg").style.display = "none";
            document.getElementById("successMsg").style.display = "none";
        }
        function showError(msg) {
            const el = document.getElementById("errorMsg");
            el.textContent = msg;
            el.style.display = "block";
        }
        function showSuccess(msg) {
            const el = document.getElementById("successMsg");
            el.textContent = msg;
            el.style.display = "block";
        }

        /**
         * Retour de Google, compte connu : la session est déjà ouverte (cookie
         * HttpOnly). Il reste à la recopier dans localStorage, que le reste
         * du site lit pour savoir qui est connecté.
         */
        async function terminerConnexionGoogle() {
            showSuccess("Connexion réussie ! Redirection…");
            try {
                const response = await fetch(`${BASE_URL}/session`, { cache: "no-store" });
                const session = await response.json();
                if (session.authenticated) {
                    fzGoogle.memoriser(session);
                    window.location.replace("index.html");
                    return;
                }
            } catch { /* message ci-dessous */ }
            hideMessages();
            showError(fzGoogle.MESSAGES.erreur);
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll("#username, #password").forEach(el => {
                el.addEventListener("keydown", e => { if (e.key === "Enter") login(); });
            });

            fzGoogle.preparerBouton("login");
            const code = fzGoogle.codeRetour();
            if (code === "ok") terminerConnexionGoogle();
            else if (fzGoogle.MESSAGES[code]) showError(fzGoogle.MESSAGES[code]);
        });
    </script>
    <script defer src="authGoogle.js?v=20260925"></script>
</head>
<body>

    <!-- Minimal top bar -->
    <header class="auth-topbar">
        <a href="index.html" class="auth-logo">
            <img src="Icons/fantazy.png" alt="Fantazy">
        </a>
        <a href="signup.html" class="auth-topbar-link">Pas encore de compte ? <strong>S'inscrire</strong></a>
    </header>

    <main class="auth-main">
        <div class="auth-card">
            <p class="card-eyebrow">Bienvenue</p>
            <h1 class="card-title">Connexion</h1>
            <p class="card-subtitle">Connectez-vous pour accéder à votre ligue fantasy.</p>

            <div id="errorMsg" class="msg msg-error" role="alert"></div>
            <div id="successMsg" class="msg msg-success" role="status"></div>

            <div id="googleBlock">
                <a id="googleBtn" class="btn-google" href="/auth/google">
                    <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                    <span class="btn-google-label">Continuer avec Google</span>
                </a>
                <div class="divider divider-top">ou</div>
            </div>

            <div class="form-group">
                <label class="form-label" for="username">Nom d'utilisateur</label>
                <input class="form-input" type="text" id="username" placeholder="Votre nom d'utilisateur" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Mot de passe</label>
                <input class="form-input" type="password" id="password" placeholder="Votre mot de passe" autocomplete="current-password" required>
            </div>

            <button id="loginBtn" class="btn-submit" onclick="login()">Se connecter</button>

            <p class="signup-link">Pas encore de compte ? <a href="signup.html">Créer un compte</a></p>
            <p class="consent-note">
                <a href="conditions.html">Conditions d'utilisation</a> ·
                <a href="confidentialite.html">Confidentialité</a><br>
                Service indépendant, sans affiliation avec la LNH.
            </p>
        </div>
    </main>

</body>
</html>
