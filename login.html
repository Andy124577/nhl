<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Fantazy</title>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"></script>
    <script defer src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <script defer src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #121214;
            --card: rgba(255,255,255,0.05);
            --border: rgba(255,255,255,0.10);
            --primary: #e8795e;
            --danger: #cc1e1e;
            --text: #f5f5f7;
            --text-muted: #a8a8b0;
            --input-bg: rgba(255,255,255,0.07);
            --input-border: rgba(255,255,255,0.12);
            --input-focus: rgba(232,121,94,0.4);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--text);
            overflow-x: hidden;
        }

        /* Background glow blobs */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
        }
        body::before {
            width: 500px; height: 500px;
            background: rgba(232,121,94,0.08);
            top: -100px; left: -100px;
        }
        body::after {
            width: 400px; height: 400px;
            background: rgba(204,30,30,0.08);
            bottom: -80px; right: -80px;
        }

        /* ── Minimal top bar ── */
        .auth-topbar {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 32px;
            border-bottom: 1px solid var(--border);
            background: rgba(10,10,31,0.8);
            backdrop-filter: blur(12px);
        }

        .auth-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .auth-logo:hover { opacity: 0.8; }
        .auth-logo img { height: 32px; width: auto; }
        .auth-logo span {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text);
            letter-spacing: 0.5px;
        }

        .auth-topbar-link {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }
        .auth-topbar-link:hover { color: var(--primary); }
        .auth-topbar-link strong { color: var(--primary); }

        /* ── Main content ── */
        .auth-main {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
        }

        /* ── Card ── */
        .auth-card {
            width: 100%;
            max-width: 420px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 44px 40px;
            backdrop-filter: blur(20px);
            box-shadow: 0 24px 64px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
            animation: cardIn 0.4s cubic-bezier(0.16,1,0.3,1);
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .card-eyebrow {
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text);
            line-height: 1.2;
            margin-bottom: 8px;
        }

        .card-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 32px;
            line-height: 1.5;
        }

        /* ── Form ── */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .form-label {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.3px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            color: var(--text);
            font-size: 0.95rem;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            outline: none;
        }
        .form-input::placeholder { color: rgba(136,146,176,0.5); }
        .form-input:hover { border-color: rgba(255,255,255,0.2); }
        .form-input:focus {
            border-color: var(--primary);
            background: rgba(232,121,94,0.05);
            box-shadow: 0 0 0 3px var(--input-focus);
        }

        /* ── Messages ── */
        .msg {
            display: none;
            font-size: 0.875rem;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-weight: 500;
        }
        .msg-error {
            background: rgba(204,30,30,0.15);
            border: 1px solid rgba(204,30,30,0.4);
            color: #ff6b7a;
        }
        .msg-success {
            background: rgba(40,167,69,0.15);
            border: 1px solid rgba(40,167,69,0.4);
            color: #5cb85c;
        }

        /* ── Submit button ── */
        .btn-submit {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            /* Primary action = --primary (cyan), matching every other primary
               button on the site — this used --danger's red, which reads as
               a warning on the page's single most inviting action. Le texte
               foncé sur l'aplat d'accent est requis pour le contraste : il
               emprunte --bg, comme partout ailleurs sur le site. */
            background: linear-gradient(135deg, var(--primary) 0%, #d4614a 100%);
            color: var(--bg);
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            letter-spacing: 0.3px;
        }
        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            /* Glow is the hover/live signal, not a rest-state halo — matches
               how every other primary button on the site treats it. */
            box-shadow: 0 8px 24px rgba(232,121,94,0.5);
            background: linear-gradient(135deg, #f1907a 0%, #de6e56 100%);
        }
        .btn-submit:active:not(:disabled) { transform: translateY(0); }
        .btn-submit:disabled {
            background: rgba(255,255,255,0.1);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
        }

        /* ── Spinner inside button ── */
        .btn-spinner {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Divider ── */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0 0;
            color: var(--text-muted);
            font-size: 0.82rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .signup-link {
            text-align: center;
            margin-top: 16px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .signup-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        .signup-link a:hover { opacity: 0.8; text-decoration: underline; }

        .consent-note {
            text-align: center;
            margin-top: 18px;
            font-size: 0.78rem;
            line-height: 1.6;
            color: var(--text-muted);
        }
        .consent-note a {
            color: var(--text-muted);
            text-decoration: underline;
            font-weight: 600;
        }
        .consent-note a:hover { color: var(--primary); }

        @media (max-width: 480px) {
            .auth-topbar { padding: 14px 20px; }
            .auth-card { padding: 32px 24px; border-radius: 16px; }
            .card-title { font-size: 1.5rem; }
        }
    </style>

    <script>
        const BASE_URL = window.location.hostname.includes("localhost")
            ? "http://localhost:3000"
            : window.location.origin;

        let isSubmitting = false;

        async function login() {
            if (isSubmitting) return;

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            hideMessages();

            if (!username || !password) { showError("Veuillez remplir tous les champs."); return; }
            if (username.length < 3) { showError("Le nom d'utilisateur doit contenir au moins 3 caractères."); return; }
            if (password.length < 4) { showError("Le mot de passe doit contenir au moins 4 caractères."); return; }

            isSubmitting = true;
            const btn = document.getElementById("loginBtn");
            btn.disabled = true;
            btn.innerHTML = '<span class="btn-spinner"></span>Connexion en cours…';

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000);

                const isAdminLogin = username === "admin";
                const endpoint = isAdminLogin ? `${BASE_URL}/admin-login` : `${BASE_URL}/login`;

                const response = await fetch(endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password }),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                const result = await response.json();

                if (response.ok) {
                    localStorage.setItem("isLoggedIn", "true");
                    localStorage.setItem("username", result.username || username);
                    localStorage.setItem("avatarUrl", result.avatarUrl || '');
                    if (isAdminLogin) localStorage.setItem("isAdmin", "true");
                    showSuccess("Connexion réussie ! Redirection…");
                    setTimeout(() => { window.location.href = "index.html"; }, 500);
                } else {
                    showError(result.message || "Identifiants incorrects.");
                }
            } catch (error) {
                if (error.name === 'AbortError') showError("La connexion a pris trop de temps. Réessayez.");
                else if (!navigator.onLine) showError("Pas de connexion internet. Vérifiez votre réseau.");
                else showError("Impossible de joindre le serveur. Réessayez.");
            } finally {
                isSubmitting = false;
                const btn = document.getElementById("loginBtn");
                btn.disabled = false;
                btn.textContent = "Se connecter";
            }
        }

        function hideMessages() {
            document.getElementById("errorMsg").style.display = "none";
            document.getElementById("successMsg").style.display = "none";
        }
        function showError(msg) {
            const el = document.getElementById("errorMsg");
            el.textContent = msg;
            el.style.display = "block";
        }
        function showSuccess(msg) {
            const el = document.getElementById("successMsg");
            el.textContent = msg;
            el.style.display = "block";
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll("#username, #password").forEach(el => {
                el.addEventListener("keydown", e => { if (e.key === "Enter") login(); });
            });
        });
    </script>
</head>
<body>

    <!-- Minimal top bar -->
    <header class="auth-topbar">
        <a href="index.html" class="auth-logo">
            <img src="Icons/fantazy.png" alt="Fantazy">
        </a>
        <a href="signup.html" class="auth-topbar-link">Pas encore de compte ? <strong>S'inscrire</strong></a>
    </header>

    <main class="auth-main">
        <div class="auth-card">
            <p class="card-eyebrow">Bienvenue</p>
            <h1 class="card-title">Connexion</h1>
            <p class="card-subtitle">Connectez-vous pour accéder à votre ligue fantasy.</p>

            <div id="errorMsg" class="msg msg-error" role="alert"></div>
            <div id="successMsg" class="msg msg-success" role="status"></div>

            <div class="form-group">
                <label class="form-label" for="username">Nom d'utilisateur</label>
                <input class="form-input" type="text" id="username" placeholder="Votre nom d'utilisateur" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Mot de passe</label>
                <input class="form-input" type="password" id="password" placeholder="Votre mot de passe" autocomplete="current-password" required>
            </div>

            <button id="loginBtn" class="btn-submit" onclick="login()">Se connecter</button>

            <div class="divider">ou</div>

            <p class="signup-link">Pas encore de compte ? <a href="signup.html">Créer un compte</a></p>
            <p class="consent-note">
                <a href="conditions.html">Conditions d'utilisation</a> ·
                <a href="confidentialite.html">Confidentialité</a><br>
                Service indépendant, sans affiliation avec la LNH.
            </p>
        </div>
    </main>

</body>
</html>
