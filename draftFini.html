<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Classement Final</title>
    <script src="theme.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="poolNav.css">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="draftFini.css" />
    <script defer src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Contexte de pool actif : doit precéder tout script de page. -->
    <script defer src="activePool.js"></script>
</head>
<body>

    <nav class="navbar">
        <!-- Navbar content will be generated by navbar.js -->
    </nav>

    <div class="container">
        <h1 id="clanTitle">Classement Final</h1>

        <div class="table-container">
            <table id="teamStatsTable">
                <thead>
                    <tr>
                        <th>POS</th>
                        <th>Équipe</th>
                        <th>Membres</th>
                        <th>GP</th>
                        <th>G</th>
                        <th>A</th>
                        <th>PTS</th>
                    </tr>
                </thead>
                <tbody id="teamStatsBody">
                    <!-- Rows will be injected here -->
                </tbody>
            </table>
        </div>

        <!-- Player Details Modal -->
        <div id="playerDetailsModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTeamName"></h2>
                    <span class="close">&times;</span>
                </div>
                <div class="modal-body">
                    <div id="playerDetailsList">
                        <!-- Player cards will be injected here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script defer src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script defer src="lib/scoring.js"></script>
    <script src="lib/season.js"></script>
    <script src="headshots.js"></script>
    <!-- Trousse de repechage 2026-2027 : bassin et projections.
         Doit preceder draftFini.js, qui l'appelle. -->
    <script defer src="draftkitData.js?v=20260905c"></script>
    <script defer src="draftFini.js?v=20260905a"></script>
    <script defer src="navbar.js"></script>
    <script defer src="poolNav.js"></script>
    <script defer src="notifications.js"></script>
</body>
</html>
