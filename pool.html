<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon pool – Fantazy</title>
    <!-- L'ancienne page « Pools » a été scindée : la création, l'adhésion et le
         repêchage vivent chacun sur leur page. Ses anciens liens (?tab=…)
         continuent d'aboutir ; sans eux, cette adresse est la page du pool
         actif. -->
    <script>
        (function () {
            var onglet = new URLSearchParams(window.location.search).get('tab');
            if (!onglet) return;
            var destinations = {
                create: 'creer-pool.html',
                available: 'rejoindre-pool.html',
                join: 'rejoindre-pool.html',
                draft: 'repechage.html',
                mypools: 'pool.html'
            };
            window.location.replace(destinations[onglet] || 'index.html');
        })();
    </script>
    <script src="theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="navbar.css?v=20260926b">
    <link rel="stylesheet" href="fzDialog.css?v=20260926b">
    <!-- Fenêtres de dialogue (fzAlert, fzConfirm) : avant tout script de page. -->

    <link rel="stylesheet" href="poolNav.css?v=20260926b">
    <link rel="stylesheet" href="poolSettings.css?v=20260926b">
    <link rel="stylesheet" href="index.css?v=20260926b">
    <link rel="stylesheet" href="poolPage.css?v=20260926b">
    <script src="icons.js" defer></script>
    <!-- Contexte de pool actif : doit précéder tout script de page. -->
    <script defer src="activePool.js?v=20260925"></script>
</head>
