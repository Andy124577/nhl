<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Écran d’accueil : nom, icône, et sur iPhone la condition des alertes. -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="Icons/apple-touch-icon.png">
    <title>Mon pool – Fantazy</title>
    <!-- L'ancienne page « Pools » a été scindée : la création, l'adhésion et le
         repêchage vivent chacun sur leur page. Ses anciens liens (?tab=…)
         continuent d'aboutir. Sans paramètre, cette adresse est l'accueil
         des pools (créer, rejoindre, mon pool) ; ?onglet=… est la page du
         pool actif. -->
    <script>
        (function () {
            var onglet = new URLSearchParams(window.location.search).get('tab');
            if (!onglet) return;
            var destinations = {
                create: 'creer-pool.html',
                available: 'rejoindre-pool.html',
                join: 'rejoindre-pool.html',
                draft: 'repechage.html',
                mypools: 'pool.html'
            };
            window.location.replace(destinations[onglet] || 'index.html');
        })();
    </script>
    <script src="theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700&family=Saira+Condensed:wght@800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="navbar.css?v=20261023b">
    <link rel="stylesheet" href="fzDialog.css?v=20260926b">
    <!-- Fenêtres de dialogue (fzAlert, fzConfirm) : avant tout script de page. -->
    <script src="fzDialog.js?v=20260926a"></script>
    <link rel="stylesheet" href="poolNav.css?v=20261003a">
    <link rel="stylesheet" href="fzSquelette.css?v=20261003a">
    <link rel="stylesheet" href="poolSettings.css?v=20260926b">
    <link rel="stylesheet" href="index.css?v=20260926b">
    <link rel="stylesheet" href="poolPage.css?v=20261003a">
    <!-- Mon pool (maquette « Fantazy Pool ») : après poolPage.css. -->
    <link rel="stylesheet" href="monPool.css?v=20261022a">
    <script src="icons.js" defer></script>
    <!-- Contexte de pool actif : doit précéder tout script de page. -->
    <script defer src="activePool.js?v=20260929n"></script>
</head>
<body data-page="pool" class="fz-pool-page">
    <nav class="navbar"></nav>

    <!-- Squelettes de la page, le temps que FZPool lise les pools : celui de
         la page d'un pool (avec ?onglet= ou ?pool=) ou celui de l'accueil des
         pools. Mêmes classes que la page chargée (poolSettings.js, rendre et
         rendreAccueil) ; les libellés connus restent lisibles, des os
         (fzSquelette.css) tiennent la place des données. poolSettings.js
         remplace tout le contenu de <main>. -->
    <main class="pp-page" id="fzPoolPage" data-vue="pool">
        <script>
            (function () {
                var p = new URLSearchParams(window.location.search);
                if (!p.has('onglet') && !p.has('pool')) document.getElementById('fzPoolPage').dataset.vue = 'accueil';
            })();
        </script>
        <p class="fz-sk-sr" role="status">Chargement du pool…</p>
        <div class="pp-sk pp-sk-pool" data-fz-sk inert>
            <header class="mp-head">
                <span class="mp-logo fz-bone"></span>
                <span class="mp-head-txt">
                    <span class="fz-bone-flat mp-sk-eyebrow"></span>
                    <span class="fz-bone mp-sk-title"></span>
                    <span class="fz-bone-flat mp-sk-sub"></span>
                </span>
            </header>
            <nav class="mp-tabs"><button type="button" class="mp-tab" tabindex="-1">Aperçu</button><button type="button" class="mp-tab" tabindex="-1">Équipes</button><button type="button" class="mp-tab" tabindex="-1">Règles</button></nav>
            <div class="mp-body">
                <div class="mp-pane">
                    <section class="mp-hero mp-sk-hero"></section>
                    <header class="mp-sh"><h2>Équipes</h2></header>
                    <ul class="mp-card mp-rows">
                        <li><span class="mp-row"><span class="fz-bone is-round mp-av"></span><span class="mp-row-txt"><span class="fz-bone mp-sk-name" style="--w:118px"></span><span class="fz-bone-flat mp-sk-meta" style="--w:84px"></span></span></span></li>
                        <li><span class="mp-row"><span class="fz-bone is-round mp-av"></span><span class="mp-row-txt"><span class="fz-bone mp-sk-name" style="--w:96px"></span><span class="fz-bone-flat mp-sk-meta" style="--w:72px"></span></span></span></li>
                        <li><span class="mp-row"><span class="fz-bone is-round mp-av"></span><span class="mp-row-txt"><span class="fz-bone mp-sk-name" style="--w:132px"></span><span class="fz-bone-flat mp-sk-meta" style="--w:66px"></span></span></span></li>
                        <li><span class="mp-row"><span class="fz-bone is-round mp-av"></span><span class="mp-row-txt"><span class="fz-bone mp-sk-name" style="--w:104px"></span><span class="fz-bone-flat mp-sk-meta" style="--w:90px"></span></span></span></li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="pp-sk pp-sk-accueil" data-fz-sk inert>
            <section class="pp-hub">
                <h1 class="pp-title">Pools</h1>
                <div class="pp-hub-actions">
                    <span class="pp-hub-btn"><span class="pp-hub-icon fz-bone"></span><span class="pp-hub-txt"><span class="pp-hub-label">Créer un pool</span></span></span>
                    <span class="pp-hub-btn"><span class="pp-hub-icon fz-bone"></span><span class="pp-hub-txt"><span class="pp-hub-label">Rejoindre un pool</span></span></span>
                    <span class="pp-hub-btn"><span class="pp-hub-img fz-bone"></span><span class="pp-hub-txt"><span class="fz-bone-flat pp-sk-hub-eyebrow"></span><span class="fz-bone pp-sk-hub-label"></span></span></span>
                </div>
            </section>
        </div>
    </main>

    <script defer src="/socket.io/socket.io.js"></script>
    <script defer src="navbar.js?v=20261023b"></script>
    <script defer src="installerApp.js?v=20261010a"></script>
    <script defer src="avatars.js"></script>
    <script defer src="profanity.js"></script>
    <script defer src="poolSettings.js?v=20261022a"></script>
    <script defer src="poolNav.js?v=20261022a"></script>
    <script defer src="poolInvites.js?v=20260925f"></script>
    <script defer src="notifications.js?v=20261023a"></script>
</body>
</html>
