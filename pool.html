<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Redirection – Fantazy</title>
    <!-- La page « Pools » a été scindée : la création, l'adhésion, la gestion
         et le repêchage vivent désormais chacune sur leur propre page, et le
         choix du pool actif se fait dans le rail latéral. Les anciens liens
         et signets continuent d'aboutir. -->
    <script>
        (function () {
            var onglet = new URLSearchParams(window.location.search).get('tab');
            var destinations = {
                create: 'creer-pool.html',
                available: 'rejoindre-pool.html',
                join: 'rejoindre-pool.html',
                draft: 'repechage.html',
                mypools: 'index.html'
            };
            window.location.replace(destinations[onglet] || 'index.html');
        })();
    </script>
</head>
<body>
    <p>Redirection vers <a href="index.html">l'accueil</a>…</p>
</body>
</html>
