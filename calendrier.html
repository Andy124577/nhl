<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Écran d’accueil : nom, icône, et sur iPhone la condition des alertes. -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="Icons/apple-touch-icon.png">
    <title>Calendrier – Fantazy</title>
    <script src="theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="navbar.css?v=20261002b">
    <link rel="stylesheet" href="fzDialog.css?v=20260926b">
    <!-- Fenêtres de dialogue (fzAlert, fzConfirm) : avant tout script de page. -->
    <script src="fzDialog.js?v=20260926a"></script>
    <link rel="stylesheet" href="teamLogos.css?v=20260926">
    <link rel="stylesheet" href="poolNav.css?v=20261003a">
    <link rel="stylesheet" href="fzSquelette.css?v=20261003a">
    <link rel="stylesheet" href="poolSettings.css?v=20260926b">
    <link rel="stylesheet" href="index.css?v=20260926b">
    <link rel="stylesheet" href="calendrier.css?v=20261004d">
    <script src="icons.js" defer></script>
    <!-- Contexte de pool actif : doit précéder tout script de page. -->
    <script defer src="activePool.js?v=20260929n"></script>
</head>
<body data-page="calendrier" class="fz-cal-page">
    <nav class="navbar"></nav>
    <!-- Sans `defer` : les barres du haut et du bas sont construites ici,
         avant le premier rendu (navbar.js, construireBarres). Différées, elles
         arrivaient après l'en-tête du calendrier, qui s'affichait seul. -->
    <script src="navbar.js?v=20261002c"></script>

    <main class="cal-page" id="calPage">
        <!-- Bureau : le nom et la journée à gauche, la semaine et « Aujourd’hui »
             à droite. Téléphone : « Aujourd’hui » remonte à côté du nom, la
             semaine passe sous la journée (calendrier.css, « En-tête »). -->
        <header class="cal-head">
            <div class="cal-eyebrow">
                <span class="cal-dot" aria-hidden="true"></span>
                <h1 class="cal-eyebrow-title">Calendrier LNH</h1>
                <span class="cal-season" id="calSeason" hidden></span>
            </div>
            <h2 class="cal-title" id="calDayTitle"><span class="fz-bone cal-sk-title"></span></h2>
            <div class="cal-week" role="group" aria-label="Semaine affichée">
                <button type="button" class="cal-nav" id="calPrev" aria-label="Semaine précédente">
                    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
                <span class="cal-range" id="calRange" aria-live="polite"></span>
                <button type="button" class="cal-nav" id="calNext" aria-label="Semaine suivante">
                    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M9 18l6-6-6-6"/></svg>
                </button>
            </div>
            <button type="button" class="cal-today" id="calToday">Aujourd’hui</button>
        </header>

        <!-- En os jusqu'à la première lecture de /schedule ; calendrier.js y pose
             aussitôt les vraies dates de la semaine (rendreSquelette). -->
        <div class="cal-strip" id="calStrip" role="tablist" aria-label="Jours de la semaine"><span class="cal-chip" aria-hidden="true"><span class="fz-bone-flat cal-sk-dow"></span><span class="fz-bone is-round cal-sk-num"></span><span class="fz-bone-flat cal-sk-count"></span></span><span class="cal-chip" aria-hidden="true"><span class="fz-bone-flat cal-sk-dow"></span><span class="fz-bone is-round cal-sk-num"></span><span class="fz-bone-flat cal-sk-count"></span></span><span class="cal-chip" aria-hidden="true"><span class="fz-bone-flat cal-sk-dow"></span><span class="fz-bone is-round cal-sk-num"></span><span class="fz-bone-flat cal-sk-count"></span></span><span class="cal-chip" aria-hidden="true"><span class="fz-bone-flat cal-sk-dow"></span><span class="fz-bone is-round cal-sk-num"></span><span class="fz-bone-flat cal-sk-count"></span></span><span class="cal-chip" aria-hidden="true"><span class="fz-bone-flat cal-sk-dow"></span><span class="fz-bone is-round cal-sk-num"></span><span class="fz-bone-flat cal-sk-count"></span></span><span class="cal-chip" aria-hidden="true"><span class="fz-bone-flat cal-sk-dow"></span><span class="fz-bone is-round cal-sk-num"></span><span class="fz-bone-flat cal-sk-count"></span></span><span class="cal-chip" aria-hidden="true"><span class="fz-bone-flat cal-sk-dow"></span><span class="fz-bone is-round cal-sk-num"></span><span class="fz-bone-flat cal-sk-count"></span></span></div>

        <section class="cal-day" aria-labelledby="calDayTitle">
            <div class="cal-bar">
                <span class="cal-summary" id="calSummary" aria-live="polite"></span>
                <!-- Seulement quand j'ai des joueurs dans le pool actif (calendrier.js, rendreFiltre). -->
                <div class="cal-filter" id="calFilter" role="group" aria-label="Matchs affichés" hidden></div>
            </div>
            <!-- Les matchs en os, aux classes de carteMatch() : calendrier.js
                 les reprend tels quels à chaque semaine qui se charge. -->
            <div class="cal-games" id="calGames">
                <p class="fz-sk-sr" role="status">Chargement du calendrier…</p>
                <article class="cal-game cal-sk-game" style="--i:0" aria-hidden="true"><div class="cal-game-status"><span class="fz-bone cal-sk-time"></span></div><div class="cal-game-teams"><div class="cal-team"><span class="fz-bone-flat cal-team-bar"></span><span class="fz-bone cal-sk-abbr"></span><span class="fz-bone-flat cal-sk-team"></span></div><div class="cal-team"><span class="fz-bone-flat cal-team-bar"></span><span class="fz-bone cal-sk-abbr"></span><span class="fz-bone-flat cal-sk-team"></span></div></div></article>
                <article class="cal-game cal-sk-game" style="--i:1" aria-hidden="true"><div class="cal-game-status"><span class="fz-bone cal-sk-time"></span></div><div class="cal-game-teams"><div class="cal-team"><span class="fz-bone-flat cal-team-bar"></span><span class="fz-bone cal-sk-abbr"></span><span class="fz-bone-flat cal-sk-team"></span></div><div class="cal-team"><span class="fz-bone-flat cal-team-bar"></span><span class="fz-bone cal-sk-abbr"></span><span class="fz-bone-flat cal-sk-team"></span></div></div></article>
                <article class="cal-game cal-sk-game" style="--i:2" aria-hidden="true"><div class="cal-game-status"><span class="fz-bone cal-sk-time"></span></div><div class="cal-game-teams"><div class="cal-team"><span class="fz-bone-flat cal-team-bar"></span><span class="fz-bone cal-sk-abbr"></span><span class="fz-bone-flat cal-sk-team"></span></div><div class="cal-team"><span class="fz-bone-flat cal-team-bar"></span><span class="fz-bone cal-sk-abbr"></span><span class="fz-bone-flat cal-sk-team"></span></div></div></article>
                <article class="cal-game cal-sk-game" style="--i:3" aria-hidden="true"><div class="cal-game-status"><span class="fz-bone cal-sk-time"></span></div><div class="cal-game-teams"><div class="cal-team"><span class="fz-bone-flat cal-team-bar"></span><span class="fz-bone cal-sk-abbr"></span><span class="fz-bone-flat cal-sk-team"></span></div><div class="cal-team"><span class="fz-bone-flat cal-team-bar"></span><span class="fz-bone cal-sk-abbr"></span><span class="fz-bone-flat cal-sk-team"></span></div></div></article>
                <article class="cal-game cal-sk-game" style="--i:4" aria-hidden="true"><div class="cal-game-status"><span class="fz-bone cal-sk-time"></span></div><div class="cal-game-teams"><div class="cal-team"><span class="fz-bone-flat cal-team-bar"></span><span class="fz-bone cal-sk-abbr"></span><span class="fz-bone-flat cal-sk-team"></span></div><div class="cal-team"><span class="fz-bone-flat cal-team-bar"></span><span class="fz-bone cal-sk-abbr"></span><span class="fz-bone-flat cal-sk-team"></span></div></div></article>
            </div>
        </section>

        <!-- Dès qu'on regarde un autre jour qu'aujourd'hui (calendrier.js, majRetour). -->
        <button type="button" class="cal-return" id="calReturn" hidden>
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
            Revenir à aujourd’hui
        </button>
    </main>

    <!-- `async` : servi avec max-age=0, il repasse par le serveur à chaque
         visite. En `defer`, cet aller-retour retenait tous les scripts qui le
         suivent ; ceux qui s'en servent l'attendent d'eux-mêmes. -->
    <script async src="/socket.io/socket.io.js"></script>
    <script defer src="teamColors.js"></script>
    <script defer src="calendrier.js?v=20261004d"></script>
    <script defer src="avatars.js"></script>
    <script defer src="profanity.js"></script>
    <script defer src="poolSettings.js?v=20260929a"></script>
    <script defer src="poolNav.js?v=20261003a"></script>
    <script defer src="poolInvites.js?v=20260925e"></script>
    <script defer src="notifications.js?v=20260930c"></script>
</body>
</html>
