<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repêchage – Fantazy</title>
    <script src="theme.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="navbar.css?v=20260923">
    <link rel="stylesheet" href="teamLogos.css">

    <link rel="stylesheet" href="pool.css?v=20260922">

<body>
    <nav class="navbar"></nav>

    <div data-fz-context></div>

    <script defer src="/socket.io/socket.io.js"></script>

    <script defer src="repechage.js?v=20260922"></script>
