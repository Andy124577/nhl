<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Écran d’accueil : nom, icône, et sur iPhone la condition des alertes. -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="Icons/apple-touch-icon.png">
    <title>Repêchage – Fantazy</title>
    <script src="theme.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <!-- Langage 6b Éditorial (repechage.css) : Saira, intertitres Saira Condensed. -->
    <link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700&family=Saira+Condensed:wght@800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="navbar.css?v=20261023b">
    <link rel="stylesheet" href="fzDialog.css?v=20260926b">
    <!-- Fenêtres de dialogue (fzAlert, fzConfirm) : avant tout script de page. -->
    <script src="fzDialog.js?v=20261026a"></script>
    <link rel="stylesheet" href="teamLogos.css?v=20260926">
    <link rel="stylesheet" href="index.css?v=20260926b">
    <link rel="stylesheet" href="pool.css?v=20261023a">
    <link rel="stylesheet" href="poolNav.css?v=20261003a">
    <link rel="stylesheet" href="fzSquelette.css?v=20261003a">
    <link rel="stylesheet" href="poolSettings.css?v=20260926b">
    <link rel="stylesheet" href="repechage.css?v=20261023a">
    <script defer src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="icons.js" defer></script>
    <!-- Contexte de pool actif : doit precéder tout script de page. -->
    <script defer src="activePool.js?v=20260929n"></script>
</head>
<body class="fz-salon-page">
    <nav class="navbar"></nav>

    <div data-fz-context></div>

    <div class="pool-page-container rp-container">
        <div id="rpContent" class="rp-content">
            <!-- Rempli par repechage.js. D'ici là, le salon en os
                 (fzSquelette.css) : le héros — état, titre, tuiles,
                 participants —, puis une carte, aux classes de rendreSalon(). -->
            <p class="fz-sk-sr" role="status">Chargement du repêchage…</p>
            <div class="rp-salon rp-sk" data-fz-sk inert>
                <section class="rp-hero">
                    <div class="rp-hero-copie">
                        <span class="fz-bone-flat rp-sk-puce"></span>
                        <span class="fz-bone rp-sk-titre"></span>
                        <span class="fz-bone rp-sk-lead"></span>
                        <span class="fz-bone rp-sk-lead is-short"></span>
                    </div>
                    <div class="rp-tuiles"><span class="fz-bone rp-sk-tuile"></span><span class="fz-bone rp-sk-tuile"></span></div>
                    <div class="rp-seats"><span class="fz-bone rp-sk-seat"></span><span class="fz-bone rp-sk-seat"></span></div>
                </section>
                <section class="rp-card rp-sk-carte">
                    <span class="fz-bone-flat rp-sk-label"></span>
                    <span class="fz-bone rp-sk-rangee"></span>
                    <span class="fz-bone rp-sk-rangee"></span>
                </section>
            </div>
        </div>
    </div>

    <script defer src="/socket.io/socket.io.js"></script>
    <!-- FZInstant : reconnaît une file instantanée et sait en sortir.
         Chargé avant repechage.js, qui s'en sert pour le bouton Quitter. -->
    <script defer src="instantDraft.js?v=20261029a"></script>
    <script defer src="repechage.js?v=20261023b"></script>
    <script defer src="navbar.js?v=20261026a"></script>
    <script defer src="installerApp.js?v=20261010a"></script>
    <script defer src="avatars.js?v=20261026a"></script>
    <script defer src="profanity.js"></script>
    <script defer src="poolSettings.js?v=20261022a"></script>
    <script defer src="poolNav.js?v=20261022a"></script>
    <script defer src="poolInvites.js?v=20260925e"></script>
    <script defer src="notifications.js?v=20261023a"></script>
</body>
</html>
