<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistiques des joueurs – Fantazy</title>
    <script src="theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="poolNav.css">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="skeleton-loader.css">
    <!-- Modale de carrière : même feuille que draftActif.html, chargée en
         dernier pour que ses règles spécialisent celles d'index.css. -->
    <link rel="stylesheet" href="career-modal.css">
    <script defer src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="icons.js" defer></script>
    <!-- Contexte de pool actif : doit precéder tout script de page. -->
    <script defer src="activePool.js"></script>
</head>
<body data-page="stats">
    <nav class="navbar"></nav>

    <!-- ============================================================ -->
    <!-- HERO HEADER                                                   -->
    <!-- ============================================================ -->
    <header class="stats-hero">
        <div class="stats-hero-spots">
            <div class="sh-spot sh-sp1"></div>
            <div class="sh-spot sh-sp2"></div>
        </div>
        <div class="stats-hero-inner">
            <h1 class="stats-hero-title">
                Statistiques
            </h1>
        </div>
    </header>

    <!-- ============================================================ -->
    <!-- MAIN CONTAINER                                                -->
    <!-- ============================================================ -->
    <div class="stats-container">
        <!-- Enhanced Filters Section -->
        <div class="filters-section">
            <div class="filter-group filter-search">
                <label for="searchInput">
                    <span class="filter-icon" data-icon="search" data-icon-size="17"></span> Rechercher
                </label>
                <input type="text" id="searchInput" placeholder="Nom du joueur">
            </div>

            <div class="filter-group">
                <label for="playerFilter">Filtre</label>
                <select id="playerFilter">
                    <option value="all">Tous les joueurs</option>
                    <option value="offensive">Attaquants</option>
                    <option value="defensive">Défenseurs</option>
                    <option value="goalies">Gardiens</option>
                    <option value="rookies">Recrues</option>
                    <option value="teams">Équipes</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="sortBy">Trier par</label>
                <select id="sortBy">
                    <option value="points">Points</option>
                    <option value="goals">Buts</option>
                    <option value="assists">Passes</option>
                    <option value="gamesPlayed">Parties jouées</option>
                </select>
            </div>
        </div>

        <!-- Table Container -->
        <div class="table-container" id="tableContainer">
            <!-- Skeleton Loader -->
            <div class="skeleton-loader" id="tableSkeleton">
                <div class="skeleton-table">
                    <div class="skeleton-table-header">
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                    </div>
                    <div class="skeleton-table-row">
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                    </div>
                    <div class="skeleton-table-row">
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                    </div>
                    <div class="skeleton-table-row">
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                    </div>
                    <div class="skeleton-table-row">
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                    </div>
                    <div class="skeleton-table-row">
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                    </div>
                    <div class="skeleton-table-row">
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                    </div>
                    <div class="skeleton-table-row">
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                    </div>
                </div>
            </div>

            <!-- Actual Content -->
            <div class="actual-content" id="actualTable" style="display: none;">
                <table id="playerTable">
                    <thead>
                        <tr>
                            <th class="rank-col" title="Rang">#</th>
                            <th class="player-col">Joueur</th>
                            <th title="Parties jouées">PJ</th>
                            <th title="Buts">B</th>
                            <th title="Passes décisives">A</th>
                            <th class="points-column" title="Points">PTS</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Dynamic content filled by JS -->
                    </tbody>
                </table>
                <div id="statsPagination" class="stats-pagination"></div>
            </div>

            <!-- Empty State -->
            <div class="stats-empty-state" id="emptyState" style="display:none;">
                <div class="empty-icon" data-icon="person" data-icon-size="56"></div>
                <h3>Aucun joueur trouvé</h3>
                <p>Essayez de modifier vos filtres ou critères de recherche</p>
            </div>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- CAREER STATS MODAL                                            -->
    <!-- ============================================================ -->
    <div id="careerStatsModal" class="modal">
        <div class="modal-content career-modal">
            <div class="career-modal-header" id="careerModalHeader" style="display: none;">
                <!-- Structure identique à draftActif.html, stylée par la feuille
                     partagée career-modal.css. Tous les id sont conservés :
                     index.js les remplit. -->
                <span class="close-modal" onclick="closeCareerModal()">&times;</span>

                <div class="cmh-identity">
                    <div class="player-headshot-container" id="playerHeadshotContainer">
                        <div class="no-photo" data-icon="person" data-icon-size="34"></div>
                    </div>
                    <div class="cmh-ident-text">
                        <h2 id="careerPlayerName"></h2>
                        <div class="cmh-chips">
                            <span class="cmh-chip"><span id="careerPlayerPosition"></span></span>
                            <span class="cmh-chip cmh-chip-team"><span id="careerPlayerTeam"></span></span>
                            <span class="cmh-chip cmh-chip-bio"><span id="playerHeight">-</span><span class="cmh-chip-sep">/</span><span id="playerWeight">-</span></span>
                        </div>
                    </div>
                </div>

                <div class="cmh-grid">
                    <div class="cmh-cell">
                        <span class="cmh-mini-lbl">Né le</span>
                        <span class="cmh-cell-val" id="playerBirthDate">-</span>
                    </div>
                    <div class="cmh-cell">
                        <span class="cmh-mini-lbl">Lieu</span>
                        <span class="cmh-cell-val" id="playerBirthPlace">-</span>
                    </div>
                    <div class="cmh-cell">
                        <span class="cmh-mini-lbl">Repêchage</span>
                        <span class="cmh-cell-val" id="playerDraft">-</span>
                    </div>
                    <div class="cmh-cell">
                        <span class="cmh-mini-lbl">Lance</span>
                        <span class="cmh-cell-val" id="playerShoots">-</span>
                    </div>
                </div>
            </div>
            <!-- Modal Skeleton Loader -->
            <div class="skeleton-loader career-skeleton" id="modalSkeleton">
                <div class="cs-header">
                  <div class="cs-identity">
                    <div class="skeleton cs-photo"></div>
                    <div class="cs-ident-text">
                      <div class="skeleton cs-name"></div>
                      <div class="cs-chips">
                        <div class="skeleton cs-chip"></div>
                        <div class="skeleton cs-chip"></div>
                        <div class="skeleton cs-chip"></div>
                      </div>
                    </div>
                  </div>
                  <div class="cs-grid">
                    <div class="skeleton cs-cell"></div>
                    <div class="skeleton cs-cell"></div>
                    <div class="skeleton cs-cell"></div>
                    <div class="skeleton cs-cell"></div>
                  </div>
                </div>
                <div class="cs-filters">
                  <div class="skeleton cs-filter"></div>
                  <div class="skeleton cs-filter"></div>
                  <div class="skeleton cs-filter"></div>
                </div>
                <div class="cs-table">
                  <div class="cs-thead"></div>
                  <div class="cs-row"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
                  <div class="cs-row"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
                  <div class="cs-row"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
                  <div class="cs-row"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
                  <div class="cs-row"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
                  <div class="cs-row"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
                </div>
              </div>
            <div class="career-filters" id="careerFilters" style="display: none;">
                <div class="filter-group-career">
                    <label for="viewFilter">Vue</label>
                    <select id="viewFilter" onchange="handleViewChange()">
                        <option value="career">Carrière</option>
                        <option value="gamelog">Historique de match</option>
                    </select>
                </div>
                <div class="filter-group-career">
                    <label for="leagueFilter">Ligue</label>
                    <select id="leagueFilter" onchange="filterCareerStats()">
                        <option value="all">Toutes les ligues</option>
                        <option value="nhl">NHL seulement</option>
                        <option value="other">Autres ligues</option>
                    </select>
                </div>
                <div class="filter-group-career">
                    <label for="gameTypeFilter">Type de saison</label>
                    <select id="gameTypeFilter" onchange="filterCareerStats()">
                        <option value="all">Tous</option>
                        <option value="regular">Saison régulière</option>
                        <option value="playoffs">Playoffs</option>
                    </select>
                </div>
                <div class="stats-count-badge" id="statsCountBadge">
                    0 saisons affichées
                </div>
            </div>
            <div id="careerStatsTable"></div>
        </div>
    </div>

    <script defer src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script defer src="lazy-load.js"></script>
    <script src="headshots.js"></script>
    <script defer src="index.js?v=20250101-debug2"></script>
    <!-- Logo d'équipe du tableau de carrière, partagé avec draftActif.html. -->
    <script defer src="careerTeamLogo.js"></script>
    <!-- Alignement de la rangée « Carrière », partagé avec draftActif.html. -->
    <script defer src="careerTotals.js"></script>
    <script defer src="navbar.js"></script>
    <script defer src="poolNav.js"></script>
    <script defer src="notifications.js"></script>
    <script>
    // Auto-open player career modal when coming from accueil hot players
    window.addEventListener('load', function() {
        var params = new URLSearchParams(window.location.search);
        var viewId = params.get('viewPlayer');
        if (viewId) {
            history.replaceState(null, '', 'stats.html');
            var attempts = 0;
            var check = setInterval(function() {
                attempts++;
                if (typeof showCareerStats === 'function') {
                    clearInterval(check);
                    showCareerStats(parseInt(viewId), '', false);
                }
                if (attempts > 50) clearInterval(check);
            }, 200);
        }
    });
    </script>
</body>
</html>
