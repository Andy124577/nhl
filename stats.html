    <script>
    // Sub-nav — "Tous les joueurs" / "Agents libres" / "Alignements" tabs.
    // « Agents libres » montre le panneau de « Tous les joueurs » :
    // statsFiltres.js y retire les joueurs pris dans le pool actif.
    function switchStatsTab(tab) {
        var panneau = tab === 'libres' ? 'tous' : tab;
        document.querySelectorAll('.stats-subnav-btn').forEach(function(btn) {
            var actif = btn.dataset.statsTab === tab;
            btn.classList.toggle('active', actif);
            btn.setAttribute('aria-pressed', String(actif));
        });
        document.body.dataset.statsTab = tab;
        document.querySelectorAll('.stats-tab-panel').forEach(function(panel) {
            panel.style.display = panel.dataset.statsPanel === panneau ? '' : 'none';
        });
        // statsLineup.js ne charge rien tant que son onglet reste fermé.
        document.dispatchEvent(new CustomEvent('fz:stats-tab', { detail: tab }));
    }

    // stats.html?onglet=libres ouvre la page sur les agents libres
    // (?onglet=alignements est lu par statsLineup.js).
    document.addEventListener('DOMContentLoaded', function() {
        if (new URLSearchParams(window.location.search).get('onglet') === 'libres') switchStatsTab('libres');
    });

    // Auto-open player career modal when coming from accueil hot players
    window.addEventListener('load', function() {
        var params = new URLSearchParams(window.location.search);
        var viewId = params.get('viewPlayer');
        if (viewId) {
            history.replaceState(null, '', 'stats.html');
            var attempts = 0;
            var check = setInterval(function() {
                attempts++;
                if (typeof showCareerStats === 'function') {
                    clearInterval(check);
                    showCareerStats(parseInt(viewId), '', false);
                }
                if (attempts > 50) clearInterval(check);
            }, 200);
        }
    });
    </script>
