    <script>
    // Sub-nav — "Tous les joueurs" / "Meneurs" tabs
    function switchStatsTab(tab) {
        document.querySelectorAll('.stats-subnav-btn').forEach(function(btn) {
            btn.classList.toggle('active', btn.dataset.statsTab === tab);
        });
        document.querySelectorAll('.stats-tab-panel').forEach(function(panel) {
            panel.style.display = panel.dataset.statsPanel === tab ? '' : 'none';
        });
    }

    // Auto-open player career modal when coming from accueil hot players
    window.addEventListener('load', function() {
        var params = new URLSearchParams(window.location.search);
        var viewId = params.get('viewPlayer');
        if (viewId) {
            history.replaceState(null, '', 'stats.html');
            var attempts = 0;
            var check = setInterval(function() {
                attempts++;
                if (typeof showCareerStats === 'function') {
                    clearInterval(check);
                    showCareerStats(parseInt(viewId), '', false);
                }
                if (attempts > 50) clearInterval(check);
            }, 200);
        }
    });
    </script>
