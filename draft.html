<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHL Draft</title>
    <script defer src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="draft.css">
    <script defer src="draft.js"></script>
    <link rel="stylesheet" href="navbar.css">
</head>
<body>
    <nav class="navbar">
        <!-- Navbar content will be generated by navbar.js -->
    </nav>

    <!-- Sub-navigation tabs -->
    <div class="sub-navbar">
        <button class="sub-nav-btn active" onclick="showTab('active')">Draft actif</button>
    </div>

    <!-- Active Drafts Section -->
    <div id="active-tab" class="tab-content active">
        <section class="draft-section">
            <h2>Drafts actifs</h2>
            <div id="activeDrafts" class="draft-container">
                <p>Chargement des drafts actifs...</p>
            </div>
        </section>
    </div>

    <script>
        // Tab switching functionality
        function showTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });

            // Remove active class from all buttons
            document.querySelectorAll('.sub-nav-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // Show selected tab
            document.getElementById(tabName + '-tab').classList.add('active');

            // Add active class to clicked button
            event.target.classList.add('active');
        }
    </script>
    <script defer src="navbar.js"></script>
</body>
    <script defer src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</html>
