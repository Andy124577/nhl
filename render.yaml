services:
  - type: web
    name: willie-pooler
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        # Set this manually in Render Dashboard with your external PostgreSQL URL
        # Example: postgresql://user:pass@host.neon.tech/dbname?sslmode=require
        sync: false
      - key: NEWSAPI_KEY
        # Set this manually in Render Dashboard (same value as your local .env).
        # Without it, /nhl-news returns an empty list and storiesCard shows no news.
        sync: false
      - key: GOOGLE_CLIENT_ID
        # "Continuer avec Google" on login/signup. Set both in Render Dashboard;
        # the button stays hidden until they are. Setup: DEPLOY_RENDER.md.
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: POOL_PASSWORD_KEY
        # Encrypts the readable copy of pool passwords (shown to the pool's
        # creator, lib/poolSecret.js). Generated once by Render; never change it
        # afterwards or existing passwords become unreadable (they still work to
        # join — the creator would just have to set a new one to see it).
        generateValue: true
      - key: ANTHROPIC_API_KEY
        # Set this manually in Render Dashboard. Used to check uploaded avatars and
        # pool images (services/moderationImage.js). Without it, uploads are still
        # accepted (file signature checked) but their content is not analysed.
        sync: false

# External database configuration (Neon.tech, Supabase, etc.)
# No database section needed - using external PostgreSQL to save Render hours
# This gives you 750h/month for the web service instead of 375h
