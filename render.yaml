services:
  - type: web
    name: willie-pooler
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        # Set this manually in Render Dashboard with your external PostgreSQL URL
        # Example: postgresql://user:pass@host.neon.tech/dbname?sslmode=require
        sync: false

# External database configuration (Neon.tech, Supabase, etc.)
# No database section needed - using external PostgreSQL to save Render hours
# This gives you 750h/month for the web service instead of 375h
