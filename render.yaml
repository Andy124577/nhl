services:
  - type: web
    name: willie-pooler
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: willie-pooler-db
          property: connectionString

databases:
  - name: willie-pooler-db
    databaseName: nhl_pool
    user: nhl_pool_user
    plan: free
