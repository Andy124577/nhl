<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!-- Écran d’accueil : nom, icône, et sur iPhone la condition des alertes. -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="Icons/apple-touch-icon.png">
    <title>Classement - Fantazy</title>
    <script src="theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="classement.css?v=20261009d" />
    <link rel="stylesheet" href="classement-premium.css?v=20261023a" />
    <link rel="stylesheet" href="index.css?v=20261031a" />
    <link rel="stylesheet" href="injuries.css?v=20260926b" />
    <link rel="stylesheet" href="skeleton-loader.css?v=20260926b" />
    <link rel="stylesheet" href="navbar.css?v=20261031a">
    <link rel="stylesheet" href="fzDialog.css?v=20260926b">
    <!-- Fenêtres de dialogue (fzAlert, fzConfirm) : avant tout script de page. -->
    <script src="fzDialog.js?v=20261026a"></script>
    <link rel="stylesheet" href="teamLogos.css?v=20260926">
    <link rel="stylesheet" href="poolNav.css?v=20261031a">
    <link rel="stylesheet" href="fzSquelette.css?v=20261003a">
    <link rel="stylesheet" href="poolSettings.css?v=20260926b">
    <!-- jQuery FIRST, synchronous -->
    <script defer src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Contexte de pool actif : doit precéder tout script de page. -->
    <script defer src="activePool.js?v=20260929n"></script>
    <!-- Icône d’étiquette du bouton et du panneau « Mettre en vente » -->
    <script defer src="icons.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="career-modal.css?v=20261030a">
    <link rel="stylesheet" href="bilanSoiree.css?v=20261016a">
    <link rel="stylesheet" href="draftFinPopup.css?v=20260926b">
    <!-- Langage 6b Éditorial (maquette « Classement ») : Saira, intertitres
         Saira Condensed. La feuille passe après toutes les autres. -->
    <link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700&family=Saira+Condensed:wght@800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="classementReskin.css?v=20261031a">
</head>
<body class="fz-classement">
    <nav class="navbar">
        <!-- Navbar content will be generated by navbar.js -->
    </nav>

    <div class="container">
        <!-- Breadcrumb Navigation -->
        <!-- Visible dès le chargement (bureau) : le nom du pool y tient la
             place d'un os jusqu'à showPoolStandings(), le titre ne saute pas. -->
        <div id="breadcrumb" class="breadcrumb" style="display: flex;">
            <span class="breadcrumb-item" onclick="window.location.href='index.html'">Accueil</span>
            <span class="breadcrumb-separator" id="poolBreadcrumbSep" style="display: inline;">&gt;</span>
            <span class="breadcrumb-item" id="poolBreadcrumb" style="display: inline;"><span class="fz-bone st-sk-crumb" aria-hidden="true"></span></span>
            <span class="breadcrumb-separator" id="teamBreadcrumbSep" style="display: none;">&gt;</span>
            <span class="breadcrumb-item" id="teamBreadcrumb" style="display: none;"></span>
        </div>

        <!-- Page Title -->
        <!-- « Classement » en surtitre, le nom du pool en os jusqu'à
             showPoolStandings(). À droite, la fraîcheur des totaux
             (majFraicheur), posée par le rendu cumulatif. -->
        <header class="st-tete">
            <h1 id="pageTitle" class="page-title"><span class="st-titre-sur">Classement</span><span class="fz-bone st-sk-titre" aria-hidden="true"></span></h1>
            <p class="st-maj" id="stMaj" hidden></p>
        </header>

        <!-- Sous-titre d'un pool H2H : mode de ligue, nombre de participants
             et état de la saison. Rempli par showPoolStandings(). -->
        <div id="poolHeaderMeta" class="pool-header-meta" style="display: none;">
            <p class="phm-line" id="poolHeaderLine"></p>
            <span class="phm-badge" id="poolHeaderBadge">Saison en cours</span>
        </div>

        <!-- Level 1 : ne sert plus qu'aux messages d'erreur (showError). Le
             classement s'ouvre directement, avec son squelette. -->
        <div id="poolListView" class="view-container" style="display: none;">
            <div id="poolList" class="pool-list" style="display: none;"></div>
        </div>

        <!-- Level 2: Pool Standings View -->
        <div id="poolStandingsView" class="view-container">
            <!-- H2H Tabs (shown only for H2H pools) -->
            <div id="h2hTabs" class="h2h-tabs" style="display: none;">
                <button class="h2h-tab active" data-tab="matchups" onclick="switchH2HTab('matchups')">
                    <svg class="h2h-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM7 5H4v2a3 3 0 0 0 3 3M17 5h3v2a3 3 0 0 1-3 3"/></svg>
                    <span>Duel en cours</span>
                </button>
                <button class="h2h-tab" data-tab="standings" onclick="switchH2HTab('standings')">
                    <svg class="h2h-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 21V9a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v12"/><path d="M8.5 13h-5a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h17a1 1 0 0 0 1-1v-4a1 1 0 0 0-1-1h-5"/><path d="M12 .6l.76 1.95 2.09.12-1.61 1.33.52 2.03L12 4.9l-1.76 1.13.52-2.03-1.61-1.33 2.09-.12z" fill="currentColor" stroke="none"/></svg>
                    <span>Classement</span>
                </button>
                <button class="h2h-tab" data-tab="calendrier" onclick="switchH2HTab('calendrier')">
                    <svg class="h2h-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
                    <span>Calendrier</span>
                </button>
                <button class="h2h-tab" data-tab="history" onclick="switchH2HTab('history')">
                    <svg class="h2h-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
                    <span>Historique</span>
                </button>
            </div>

            <!-- H2H — Classement : bande de tuiles de contexte (semaine en
                 cours, bilan de chaque participant, points marqués, prochain
                 duel). Remplie par renderH2HStandingsStrip(). -->
            <div id="h2hStandingsStrip" class="h2h-strip" style="display: none;"></div>

            <!-- H2H: Current Matchups -->
            <div id="h2hMatchupsView" class="h2h-section" style="display: none;">
                <div class="h2h-week-header" id="h2hWeekHeader"></div>
                <div class="h2h-period-filter" id="h2hPeriodFilter">
                    <button class="h2h-period-btn active" id="filterToday" onclick="setH2HPeriod('today')">Aujourd'hui</button>
                    <button class="h2h-period-btn" id="filterWeek" onclick="setH2HPeriod('week')">Semaine</button>
                </div>
                <div id="h2hMatchupsList" class="h2h-matchups-list"></div>
            </div>

            <!-- Squelette du classement : les classes de la carte chargée
                 (rangeeClassementHTML) — la même sur téléphone et sur bureau —,
                 donc rien ne bouge à l'arrivée des données. Un seul reflet
                 balaie tous les os à la fois ; les rangées montent l'une après
                 l'autre. Le nombre de rangées suit celui des équipes dès que le
                 pool est connu (ajusterSqueletteClassement). Les vrais libellés
                 (Saison, PJ, 7 j…) restent lisibles : on sait déjà ce qui arrive. -->
            <div class="st-sk" id="standingsSkeleton" aria-busy="true">
                <p class="st-sk-sr" role="status">Chargement du classement…</p>
                <div class="st-sk-body" inert>
                    <div class="st-periodes"><span class="st-periode is-on">Saison</span><span class="st-periode">Hier</span><span class="st-periode">7 jours</span><span class="st-periode">30 jours</span></div>
                    <section class="st-carte">
                        <div class="st-rangees st-sk-list">
                            <div class="st-rangee" style="--i:0">
                                <span class="st-rang">1</span>
                                <span class="st-logo fz-bone"></span>
                                <span class="st-centre">
                                    <span class="st-nom-ligne"><span class="fz-bone st-sk-nom" style="--w:min(96px, 46%)"></span></span>
                                    <span class="st-chiffres"><span class="st-chiffre"><span class="fz-bone st-sk-v" style="--w:16px"></span><small>PJ</small></span><span class="st-chiffre"><span class="fz-bone st-sk-v" style="--w:10px"></span><small>1 j</small></span><span class="st-chiffre"><span class="fz-bone st-sk-v" style="--w:14px"></span><small>7 j</small></span><span class="st-chiffre"><span class="fz-bone st-sk-v" style="--w:16px"></span><small>30 j</small></span></span>
                                </span>
                                <span class="st-total"><span class="fz-bone st-sk-total"></span><span class="fz-bone-flat st-sk-ecart"></span></span>
                                <svg class="st-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
                            </div>
                            <div class="st-rangee" style="--i:1">
                                <span class="st-rang">2</span>
                                <span class="st-logo fz-bone"></span>
                                <span class="st-centre">
                                    <span class="st-nom-ligne"><span class="fz-bone st-sk-nom" style="--w:min(162px, 78%)"></span></span>
                                    <span class="st-chiffres"><span class="st-chiffre"><span class="fz-bone st-sk-v" style="--w:16px"></span><small>PJ</small></span><span class="st-chiffre"><span class="fz-bone st-sk-v" style="--w:10px"></span><small>1 j</small></span><span class="st-chiffre"><span class="fz-bone st-sk-v" style="--w:14px"></span><small>7 j</small></span><span class="st-chiffre"><span class="fz-bone st-sk-v" style="--w:16px"></span><small>30 j</small></span></span>
                                </span>
                                <span class="st-total"><span class="fz-bone st-sk-total"></span><span class="fz-bone-flat st-sk-ecart"></span></span>
                                <svg class="st-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
                            </div>
                            <div class="st-rangee" style="--i:2">
                                <span class="st-rang">3</span>
                                <span class="st-logo fz-bone"></span>
                                <span class="st-centre">
                                    <span class="st-nom-ligne"><span class="fz-bone st-sk-nom" style="--w:min(121px, 58%)"></span></span>
                                    <span class="st-chiffres"><span class="st-chiffre"><span class="fz-bone st-sk-v" style="--w:16px"></span><small>PJ</small></span><span class="st-chiffre"><span class="fz-bone st-sk-v" style="--w:10px"></span><small>1 j</small></span><span class="st-chiffre"><span class="fz-bone st-sk-v" style="--w:14px"></span><small>7 j</small></span><span class="st-chiffre"><span class="fz-bone st-sk-v" style="--w:16px"></span><small>30 j</small></span></span>
                                </span>
                                <span class="st-total"><span class="fz-bone st-sk-total"></span><span class="fz-bone-flat st-sk-ecart"></span></span>
                                <svg class="st-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
                            </div>
                            <div class="st-rangee" style="--i:3">
                                <span class="st-rang">4</span>
                                <span class="st-logo fz-bone"></span>
                                <span class="st-centre">
                                    <span class="st-nom-ligne"><span class="fz-bone st-sk-nom" style="--w:min(171px, 82%)"></span></span>
                                    <span class="st-chiffres"><span class="st-chiffre"><span class="fz-bone st-sk-v" style="--w:16px"></span><small>PJ</small></span><span class="st-chiffre"><span class="fz-bone st-sk-v" style="--w:10px"></span><small>1 j</small></span><span class="st-chiffre"><span class="fz-bone st-sk-v" style="--w:14px"></span><small>7 j</small></span><span class="st-chiffre"><span class="fz-bone st-sk-v" style="--w:16px"></span><small>30 j</small></span></span>
                                </span>
                                <span class="st-total"><span class="fz-bone st-sk-total"></span><span class="fz-bone-flat st-sk-ecart"></span></span>
                                <svg class="st-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
                            </div>
                            <div class="st-rangee" style="--i:4">
                                <span class="st-rang">5</span>
                                <span class="st-logo fz-bone"></span>
                                <span class="st-centre">
                                    <span class="st-nom-ligne"><span class="fz-bone st-sk-nom" style="--w:min(92px, 44%)"></span></span>
                                    <span class="st-chiffres"><span class="st-chiffre"><span class="fz-bone st-sk-v" style="--w:16px"></span><small>PJ</small></span><span class="st-chiffre"><span class="fz-bone st-sk-v" style="--w:10px"></span><small>1 j</small></span><span class="st-chiffre"><span class="fz-bone st-sk-v" style="--w:14px"></span><small>7 j</small></span><span class="st-chiffre"><span class="fz-bone st-sk-v" style="--w:16px"></span><small>30 j</small></span></span>
                                </span>
                                <span class="st-total"><span class="fz-bone st-sk-total"></span><span class="fz-bone-flat st-sk-ecart"></span></span>
                                <svg class="st-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
                            </div>
                            <div class="st-rangee" style="--i:5">
                                <span class="st-rang">6</span>
                                <span class="st-logo fz-bone"></span>
                                <span class="st-centre">
                                    <span class="st-nom-ligne"><span class="fz-bone st-sk-nom" style="--w:min(133px, 64%)"></span></span>
                                    <span class="st-chiffres"><span class="st-chiffre"><span class="fz-bone st-sk-v" style="--w:16px"></span><small>PJ</small></span><span class="st-chiffre"><span class="fz-bone st-sk-v" style="--w:10px"></span><small>1 j</small></span><span class="st-chiffre"><span class="fz-bone st-sk-v" style="--w:14px"></span><small>7 j</small></span><span class="st-chiffre"><span class="fz-bone st-sk-v" style="--w:16px"></span><small>30 j</small></span></span>
                                </span>
                                <span class="st-total"><span class="fz-bone st-sk-total"></span><span class="fz-bone-flat st-sk-ecart"></span></span>
                                <svg class="st-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
                            </div>
                            <div class="st-rangee" style="--i:6">
                                <span class="st-rang">7</span>
                                <span class="st-logo fz-bone"></span>
                                <span class="st-centre">
                                    <span class="st-nom-ligne"><span class="fz-bone st-sk-nom" style="--w:min(104px, 50%)"></span></span>
                                    <span class="st-chiffres"><span class="st-chiffre"><span class="fz-bone st-sk-v" style="--w:16px"></span><small>PJ</small></span><span class="st-chiffre"><span class="fz-bone st-sk-v" style="--w:10px"></span><small>1 j</small></span><span class="st-chiffre"><span class="fz-bone st-sk-v" style="--w:14px"></span><small>7 j</small></span><span class="st-chiffre"><span class="fz-bone st-sk-v" style="--w:16px"></span><small>30 j</small></span></span>
                                </span>
                                <span class="st-total"><span class="fz-bone st-sk-total"></span><span class="fz-bone-flat st-sk-ecart"></span></span>
                                <svg class="st-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
                            </div>
                        </div>
                        <details class="st-aide st-sk-aide"><summary><span>Comment lire ce classement</span></summary></details>
                    </section>
                    <!-- Rempli par classement.js (hofChargementHTML) : le même
                         temple fantôme que pendant sa lecture. -->
                    <div class="standings-insights st-sk-insights">
                        <div class="hall-of-fame" id="standingsSkeletonHof"></div>
                    </div>
                </div>
            </div>
            <!-- Standings Content -->
            <div id="standingsList" class="standings-list" style="display: none;">
                <!-- Standings table is injected here -->
            </div>

            <!-- Bas du classement : temple de la renommée et — en H2H
                 seulement — les derniers résultats. En H2H la classe `is-h2h`
                 les met côte à côte sur grand écran. -->
            <div id="standingsInsights" class="standings-insights">
                <!-- Temple de la renommée : record et pire journée, semaine, mois -->
                <div id="hallOfFame" class="hall-of-fame" style="display: none;">
                    <!-- Injected by renderHallOfFame() -->
                </div>

                <!-- H2H : les dernières semaines finalisées, vues du côté de
                     votre équipe. Rempli par renderH2HRecentResults(). -->
                <div id="h2hRecentResults" class="h2h-recent-results" style="display: none;">
                    <!-- Injected by renderH2HRecentResults() -->
                </div>
            </div>

            <!-- H2H: Calendrier de la saison — carrousel de toutes les
                 semaines de duel, du premier lundi au dernier, pour l'équipe
                 choisie. Rempli par renderH2HSchedule(). -->
            <div id="h2hScheduleView" class="h2h-section" style="display: none;">
                <div class="h2h-sched-head">
                    <div class="h2h-sched-intro">
                        <div class="h2h-sched-title" id="h2hSchedTitle">Calendrier de la saison</div>
                        <div class="h2h-sched-sub" id="h2hSchedSub"></div>
                    </div>
                    <label class="h2h-sched-picker">
                        <span>Équipe</span>
                        <select id="h2hSchedTeam" onchange="onH2HScheduleTeamChange(this.value)"></select>
                    </label>
                </div>
                <div class="h2h-sched-carousel">
                    <button type="button" class="h2h-sched-arrow prev" id="h2hSchedPrev"
                            onclick="scrollH2HSchedule(-1)" aria-label="Semaines précédentes">&#8249;</button>
                    <div class="h2h-sched-track" id="h2hSchedTrack"></div>
                    <button type="button" class="h2h-sched-arrow next" id="h2hSchedNext"
                            onclick="scrollH2HSchedule(1)" aria-label="Semaines suivantes">&#8250;</button>
                </div>
            </div>

            <!-- H2H: History -->
            <div id="h2hHistoryView" class="h2h-section" style="display: none;">
                <div id="h2hHistoryList" class="h2h-history-list"></div>
            </div>
        </div>

        <!-- Level 3: Team Roster View -->
        <div id="teamRosterView" class="view-container" style="display: none;">
            <!-- En-tête de la fiche : retour, nom (sélecteur d'équipe), rang,
                 bouton « Mettre en vente ». Rempli par renderRosterHeader(). -->
            <div id="rosterHeader" class="roster-header"></div>
            <!-- Squelette de la fiche : les rangées de la liste, une par joueur
                 actif, rangs et libellés réels, des os à la place des données.
                 Rempli par showTeamRoster (rosterSqueletteHTML). -->
            <div class="rr-sk" id="rosterSkeleton" aria-busy="true" style="display: none;"></div>
            <!-- Actual Content -->
            <div id="rosterList" class="roster-list" style="display: none;">
                <!-- Player cards will be injected here -->
            </div>
        </div>

        <!-- Career Stats Modal -->
        <!-- Shared player profile, mounted by careerModal.js. -->
    <div id="careerStatsModal" class="modal"></div>
    </div>

    <script defer src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script defer src="lazy-load.js"></script>
    <script defer src="avatars.js?v=20261026a"></script>
    <script defer src="lib/scoring.js?v=20261001a"></script>
    <script defer src="lib/pointsEnDirect.js?v=20261002b"></script>
    <script defer src="pointsDirect.js?v=20261002a"></script>
    <script src="lib/season.js"></script>
    <script src="headshots.js"></script>
    <script defer src="injuries.js"></script>
    <script defer src="teamColors.js"></script>
    <script defer src="careerFetch.js"></script>
    <script defer src="careerModal.js?v=20261030a"></script>
    <script defer src="careerTeamLogo.js"></script>
    <script defer src="careerTotals.js"></script>
    <script defer src="draftkitData.js?v=20261030a"></script>
    <!-- Récapitulatif « Ton équipe est complète », ouvert par classement.js (?recap=1). -->
    <script defer src="draftFinPopup.js?v=20261022b"></script>
    <script defer src="classement.js?v=20261023a"></script>
    <script defer src="navbar.js?v=20261026a"></script>
    <script defer src="installerApp.js?v=20261010a"></script>
    <!-- Bilan de la soirée : surgit une fois le dernier match du soir fini. -->
    <script defer src="bilanSoiree.js?v=20261016a"></script>
    <script defer src="profanity.js"></script>
    <script defer src="poolSettings.js?v=20261022a"></script>
    <script defer src="poolNav.js?v=20261029m"></script>
    <script defer src="poolInvites.js?v=20260925e"></script>
    <script defer src="notifications.js?v=20261028a"></script>
</body>
</html>
