<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Classement - Fantazy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="classement.css" />
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="skeleton-loader.css" />
    <link rel="stylesheet" href="navbar.css">
</head>
<body>

    <nav class="navbar">
        <!-- Navbar content will be generated by navbar.js -->
    </nav>

    <div class="container">
        <div id="noPoolSelected" class="empty-state-container">
            <div class="empty-state-icon">📊</div>
            <h2>Aucun pool sélectionné</h2>
            <p>Veuillez sélectionner un pool actif dans la barre de navigation ci-dessus</p>
        </div>

        <!-- CUMULATIVE MODE: Points totaux -->
        <div id="cumulativeContent" style="display: none;">
            <div class="table-container">
                <!-- Skeleton Loader -->
                <div class="skeleton-loader" id="cumulativeSkeleton">
                    <div class="skeleton-table">
                        <div class="skeleton-table-header">
                            <div class="skeleton"></div>
                            <div class="skeleton"></div>
                            <div class="skeleton"></div>
                            <div class="skeleton"></div>
                            <div class="skeleton"></div>
                            <div class="skeleton"></div>
                            <div class="skeleton"></div>
                        </div>
                        <div class="skeleton-table-row">
                            <div class="skeleton"></div>
                            <div class="skeleton"></div>
                            <div class="skeleton"></div>
                            <div class="skeleton"></div>
                            <div class="skeleton"></div>
                            <div class="skeleton"></div>
                            <div class="skeleton"></div>
                        </div>
                        <div class="skeleton-table-row">
                            <div class="skeleton"></div>
                            <div class="skeleton"></div>
                            <div class="skeleton"></div>
                            <div class="skeleton"></div>
                            <div class="skeleton"></div>
                            <div class="skeleton"></div>
                            <div class="skeleton"></div>
                        </div>
                        <div class="skeleton-table-row">
                            <div class="skeleton"></div>
                            <div class="skeleton"></div>
                            <div class="skeleton"></div>
                            <div class="skeleton"></div>
                            <div class="skeleton"></div>
                            <div class="skeleton"></div>
                            <div class="skeleton"></div>
                        </div>
                    </div>
                </div>
                <!-- Actual Content -->
                <table id="teamStatsTable" class="actual-content" style="display: none;">
                    <thead>
                        <tr>
                            <th>POS</th>
                            <th>Équipe</th>
                            <th>Membres</th>
                            <th>GP</th>
                            <th>G</th>
                            <th>A</th>
                            <th>PTS</th>
                        </tr>
                    </thead>
                    <tbody id="teamStatsBody">
                        <!-- Rows will be injected here -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- HEAD-TO-HEAD MODE: Duels hebdomadaires -->
        <div id="h2hContent" style="display: none;">
            <!-- Sub-navigation for H2H -->
            <div class="sub-navbar">
                <button class="sub-nav-btn active" onclick="showH2HTab('current')">Duel en cours</button>
                <button class="sub-nav-btn" onclick="showH2HTab('standings')">Classement</button>
                <button class="sub-nav-btn" onclick="showH2HTab('history')">Historique</button>
            </div>

            <!-- Current Matchup Tab -->
            <div id="current-h2h-tab" class="h2h-tab-content active">
                <div class="current-matchup-container">
                    <h3 id="currentWeekTitle">Semaine 1</h3>
                    <div id="currentMatchupsList">
                        <!-- Skeleton Loader -->
                        <div class="skeleton-loader" id="matchupsSkeleton">
                            <div class="skeleton-card">
                                <div class="skeleton-card-content">
                                    <div class="skeleton" style="width: 200px; height: 24px; margin: 0 auto 16px;"></div>
                                    <div class="skeleton" style="width: 150px; height: 40px; margin: 0 auto;"></div>
                                </div>
                            </div>
                            <div class="skeleton-card">
                                <div class="skeleton-card-content">
                                    <div class="skeleton" style="width: 200px; height: 24px; margin: 0 auto 16px;"></div>
                                    <div class="skeleton" style="width: 150px; height: 40px; margin: 0 auto;"></div>
                                </div>
                            </div>
                        </div>
                        <!-- Actual Content -->
                        <div class="actual-content" id="matchupsContent" style="display: none;"></div>
                    </div>
                </div>
            </div>

            <!-- Standings Tab -->
            <div id="standings-h2h-tab" class="h2h-tab-content">
                <div class="h2h-standings-container">
                    <!-- Skeleton Loader -->
                    <div class="skeleton-loader" id="h2hStandingsSkeleton">
                        <div class="skeleton-table">
                            <div class="skeleton-table-header">
                                <div class="skeleton"></div>
                                <div class="skeleton"></div>
                                <div class="skeleton"></div>
                                <div class="skeleton"></div>
                                <div class="skeleton"></div>
                                <div class="skeleton"></div>
                                <div class="skeleton"></div>
                                <div class="skeleton"></div>
                            </div>
                            <div class="skeleton-table-row">
                                <div class="skeleton"></div>
                                <div class="skeleton"></div>
                                <div class="skeleton"></div>
                                <div class="skeleton"></div>
                                <div class="skeleton"></div>
                                <div class="skeleton"></div>
                                <div class="skeleton"></div>
                                <div class="skeleton"></div>
                            </div>
                            <div class="skeleton-table-row">
                                <div class="skeleton"></div>
                                <div class="skeleton"></div>
                                <div class="skeleton"></div>
                                <div class="skeleton"></div>
                                <div class="skeleton"></div>
                                <div class="skeleton"></div>
                                <div class="skeleton"></div>
                                <div class="skeleton"></div>
                            </div>
                        </div>
                    </div>
                    <!-- Actual Content -->
                    <table id="h2hStandingsTable" class="actual-content" style="display: none;">
                        <thead>
                            <tr>
                                <th>POS</th>
                                <th>Équipe</th>
                                <th>V</th>
                                <th>D</th>
                                <th>N</th>
                                <th>PF</th>
                                <th>PA</th>
                                <th>DIFF</th>
                            </tr>
                        </thead>
                        <tbody id="h2hStandingsBody">
                            <!-- Standings rows will be injected here -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- History Tab -->
            <div id="history-h2h-tab" class="h2h-tab-content">
                <div class="h2h-history-container">
                    <div id="matchupHistoryList">
                        <!-- Skeleton Loader -->
                        <div class="skeleton-loader" id="historySkeleton">
                            <div class="skeleton-card">
                                <div class="skeleton-card-content">
                                    <div class="skeleton" style="width: 120px; height: 18px; margin-bottom: 12px;"></div>
                                    <div class="skeleton" style="width: 200px; height: 24px; margin: 0 auto 16px;"></div>
                                    <div class="skeleton" style="width: 150px; height: 40px; margin: 0 auto;"></div>
                                </div>
                            </div>
                            <div class="skeleton-card">
                                <div class="skeleton-card-content">
                                    <div class="skeleton" style="width: 120px; height: 18px; margin-bottom: 12px;"></div>
                                    <div class="skeleton" style="width: 200px; height: 24px; margin: 0 auto 16px;"></div>
                                    <div class="skeleton" style="width: 150px; height: 40px; margin: 0 auto;"></div>
                                </div>
                            </div>
                        </div>
                        <!-- Actual Content -->
                        <div class="actual-content" id="historyContent" style="display: none;"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Player Details Modal -->
        <div id="playerDetailsModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTeamName"></h2>
                    <span class="close">&times;</span>
                </div>
                <div class="modal-body">
                    <div id="playerDetailsList">
                        <!-- Player cards will be injected here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Career Stats Modal - NHL.com Style -->
        <div id="careerStatsModal" class="modal">
            <div class="modal-content career-modal">
                <!-- Career Modal Header with Player Photo -->
                <div class="career-modal-header" id="careerModalHeader" style="display: none;">
                    <div class="player-headshot-container" id="playerHeadshotContainer">
                        <div class="no-photo">🏒</div>
                    </div>
                    <div class="player-info-section">
                        <div class="player-name-row">
                            <h2 id="careerPlayerName"></h2>
                            <span class="close-modal" onclick="closeCareerModal()">&times;</span>
                        </div>
                        <div class="player-position-team">
                            <span id="careerPlayerPosition"></span>
                            <span id="careerPlayerTeam"></span>
                        </div>
                        <div class="player-bio-grid">
                            <div class="bio-stat">
                                <span class="bio-label">Taille</span>
                                <span class="bio-value" id="playerHeight">-</span>
                            </div>
                            <div class="bio-stat">
                                <span class="bio-label">Poids</span>
                                <span class="bio-value" id="playerWeight">-</span>
                            </div>
                            <div class="bio-stat">
                                <span class="bio-label">Né le</span>
                                <span class="bio-value" id="playerBirthDate">-</span>
                            </div>
                            <div class="bio-stat">
                                <span class="bio-label">Lieu</span>
                                <span class="bio-value" id="playerBirthPlace">-</span>
                            </div>
                            <div class="bio-stat">
                                <span class="bio-label">Lance</span>
                                <span class="bio-value" id="playerShoots">-</span>
                            </div>
                            <div class="bio-stat">
                                <span class="bio-label">Repêchage</span>
                                <span class="bio-value" id="playerDraft">-</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Loading Spinner -->
                <div class="loading-spinner" id="loadingSpinner">
                    Chargement des statistiques...
                </div>

                <!-- Career Filters -->
                <div class="career-filters" id="careerFilters" style="display: none;">
                    <div class="filter-group-career">
                        <label for="leagueFilter">Ligue</label>
                        <select id="leagueFilter" onchange="filterCareerStats()">
                            <option value="all">Toutes les ligues</option>
                            <option value="nhl">NHL seulement</option>
                            <option value="other">Autres ligues</option>
                        </select>
                    </div>
                    <div class="filter-group-career">
                        <label for="gameTypeFilter">Type de saison</label>
                        <select id="gameTypeFilter" onchange="filterCareerStats()">
                            <option value="all">Tous</option>
                            <option value="regular">Saison régulière</option>
                            <option value="playoffs">Playoffs</option>
                        </select>
                    </div>
                    <div class="stats-count-badge" id="statsCountBadge">
                        0 saisons affichées
                    </div>
                </div>

                <!-- Career Stats Table -->
                <div id="careerStatsTable"></div>
            </div>
        </div>
    </div>

    <script defer src="lazy-load.js"></script>
    <script defer src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script defer src="navbar.js"></script>
    <script defer src="classement.js"></script>
</body>
</html>
