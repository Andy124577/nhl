<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Classement - Fantazy</title>
    <script src="theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="classement.css" />
    <link rel="stylesheet" href="classement-premium.css" />
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="injuries.css" />
    <link rel="stylesheet" href="skeleton-loader.css" />
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="poolNav.css">
    <!-- jQuery FIRST, synchronous -->
    <script defer src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Contexte de pool actif : doit precéder tout script de page. -->
    <script defer src="activePool.js"></script>
    <!-- Icônes injectées dans les cartes de rôle (toggle "mettre en vente") -->
    <script defer src="icons.js"></script>
</head>
<body class="fz-classement">
    <nav class="navbar">
        <!-- Navbar content will be generated by navbar.js -->
    </nav>

    <div class="container">
        <!-- Breadcrumb Navigation -->
        <div id="breadcrumb" class="breadcrumb" style="display: none;">
            <span class="breadcrumb-item" onclick="window.location.href='mes-pools.html'">Mes pools</span>
            <span class="breadcrumb-separator" id="poolBreadcrumbSep" style="display: none;">&gt;</span>
            <span class="breadcrumb-item" id="poolBreadcrumb" style="display: none;"></span>
            <span class="breadcrumb-separator" id="teamBreadcrumbSep" style="display: none;">&gt;</span>
            <span class="breadcrumb-item" id="teamBreadcrumb" style="display: none;"></span>
        </div>

        <!-- Page Title -->
        <h1 id="pageTitle" class="page-title">Classement</h1>

        <!-- Level 1: Pool List View -->
        <div id="poolListView" class="view-container">
            <!-- Skeleton Loader -->
            <div class="skeleton-loader" id="poolListSkeleton">
                <div class="pool-card-skeleton">
                    <div class="skeleton-circle"></div>
                    <div class="skeleton-content">
                        <div class="skeleton skeleton-title"></div>
                        <div class="skeleton skeleton-subtitle"></div>
                    </div>
                </div>
                <div class="pool-card-skeleton">
                    <div class="skeleton-circle"></div>
                    <div class="skeleton-content">
                        <div class="skeleton skeleton-title"></div>
                        <div class="skeleton skeleton-subtitle"></div>
                    </div>
                </div>
                <div class="pool-card-skeleton">
                    <div class="skeleton-circle"></div>
                    <div class="skeleton-content">
                        <div class="skeleton skeleton-title"></div>
                        <div class="skeleton skeleton-subtitle"></div>
                    </div>
                </div>
            </div>
            <!-- Actual Content -->
            <div id="poolList" class="pool-list" style="display: none;">
                <!-- Pool cards will be injected here -->
            </div>
        </div>

        <!-- Level 2: Pool Standings View -->
        <div id="poolStandingsView" class="view-container" style="display: none;">
            <!-- H2H Tabs (shown only for H2H pools) -->
            <div id="h2hTabs" class="h2h-tabs" style="display: none;">
                <button class="h2h-tab active" data-tab="matchups" onclick="switchH2HTab('matchups')">Duel en cours</button>
                <button class="h2h-tab" data-tab="standings" onclick="switchH2HTab('standings')">Classement</button>
                <button class="h2h-tab" data-tab="history" onclick="switchH2HTab('history')">Historique</button>
            </div>

            <!-- H2H: Current Matchups -->
            <div id="h2hMatchupsView" class="h2h-section" style="display: none;">
                <div class="h2h-week-header" id="h2hWeekHeader"></div>
                <div class="h2h-period-filter" id="h2hPeriodFilter">
                    <button class="h2h-period-btn active" id="filterToday" onclick="setH2HPeriod('today')">Aujourd'hui</button>
                    <button class="h2h-period-btn" id="filterWeek" onclick="setH2HPeriod('week')">Semaine</button>
                </div>
                <div id="h2hMatchupsList" class="h2h-matchups-list"></div>
            </div>

            <!-- Skeleton Loader (for standings) -->
            <div class="skeleton-loader" id="standingsSkeleton">
                <div class="standings-table-skeleton">
                    <div class="standings-skeleton-row">
                        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
                        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
                        <div class="skeleton"></div><div class="skeleton"></div>
                    </div>
                    <div class="standings-skeleton-row">
                        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
                        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
                        <div class="skeleton"></div><div class="skeleton"></div>
                    </div>
                    <div class="standings-skeleton-row">
                        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
                        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
                        <div class="skeleton"></div><div class="skeleton"></div>
                    </div>
                    <div class="standings-skeleton-row">
                        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
                        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
                        <div class="skeleton"></div><div class="skeleton"></div>
                    </div>
                </div>
            </div>
            <!-- Standings Content -->
            <div id="standingsList" class="standings-list" style="display: none;">
                <!-- Standings table is injected here -->
            </div>

            <!-- Hall of Fame: best/worst day, week, month (cumulative pools) -->
            <div id="hallOfFame" class="hall-of-fame" style="display: none;">
                <!-- Injected by renderHallOfFame() -->
            </div>

            <!-- Recent form: windowed best-team leaderboard (cumulative pools).
                 Relocated from the old homepage Activity tab — see
                 accueil-dash.js — since that's the only place it lived. -->
            <div id="recentFormLeaderboard" class="recent-form-leaderboard" style="display: none;">
                <!-- Injected by renderRecentFormLeaderboard() -->
            </div>

            <!-- H2H: History -->
            <div id="h2hHistoryView" class="h2h-section" style="display: none;">
                <div id="h2hHistoryList" class="h2h-history-list"></div>
            </div>
        </div>

        <!-- Level 3: Team Roster View -->
        <div id="teamRosterView" class="view-container" style="display: none;">
            <!-- Skeleton Loader -->
            <div class="skeleton-loader" id="rosterSkeleton">
                <div class="roster-card-skeleton">
                    <div class="skeleton-avatar"></div>
                    <div class="skeleton-content">
                        <div class="skeleton skeleton-player-name"></div>
                        <div class="skeleton skeleton-player-stats"></div>
                    </div>
                    <div class="skeleton skeleton-player-points"></div>
                </div>
                <div class="roster-card-skeleton">
                    <div class="skeleton-avatar"></div>
                    <div class="skeleton-content">
                        <div class="skeleton skeleton-player-name"></div>
                        <div class="skeleton skeleton-player-stats"></div>
                    </div>
                    <div class="skeleton skeleton-player-points"></div>
                </div>
                <div class="roster-card-skeleton">
                    <div class="skeleton-avatar"></div>
                    <div class="skeleton-content">
                        <div class="skeleton skeleton-player-name"></div>
                        <div class="skeleton skeleton-player-stats"></div>
                    </div>
                    <div class="skeleton skeleton-player-points"></div>
                </div>
            </div>
            <!-- Actual Content -->
            <div id="rosterList" class="roster-list" style="display: none;">
                <!-- Player cards will be injected here -->
            </div>
        </div>

        <!-- Career Stats Modal -->
        <div id="careerStatsModal" class="modal">
            <div class="modal-content career-modal">
                <div class="career-modal-header" id="careerModalHeader" style="display: none;">
                    <span class="close-modal" onclick="closeCareerModal()">&times;</span>
                    <div class="player-header-top">
                        <div class="player-headshot-container" id="playerHeadshotContainer">
                            <div class="no-photo">🏒</div>
                        </div>
                        <div class="player-header-right">
                            <div class="player-name-section">
                                <h2 id="careerPlayerName"></h2>
                                <div class="player-position-team">
                                    <span id="careerPlayerPosition"></span>
                                    <span id="careerPlayerTeam"></span>
                                </div>
                            </div>
                            <div class="player-bio-pills">
                                <span class="bio-pill"><span class="bio-pill-lbl">Taille</span><strong class="bio-pill-val" id="playerHeight">-</strong></span>
                                <span class="bio-pill"><span class="bio-pill-lbl">Poids</span><strong class="bio-pill-val" id="playerWeight">-</strong></span>
                                <span class="bio-pill"><span class="bio-pill-lbl">Lance</span><strong class="bio-pill-val" id="playerShoots">-</strong></span>
                                <span class="bio-pill"><span class="bio-pill-lbl">Né le</span><strong class="bio-pill-val" id="playerBirthDate">-</strong></span>
                                <span class="bio-pill"><span class="bio-pill-lbl">Lieu</span><strong class="bio-pill-val" id="playerBirthPlace">-</strong></span>
                            </div>
                        </div>
                    </div>
                    <div class="player-draft-strip">
                        <span class="draft-label">Repêchage</span>
                        <span class="draft-value" id="playerDraft">-</span>
                    </div>
                    <!-- Indisponibilité en cours : nature et durée, remplies
                         par renderInjuryBanner() (injuries.js). Reste masqué
                         pour un joueur en santé. -->
                    <div class="cmh-injury" id="careerInjuryBanner" hidden></div>
                </div>
                <div class="loading-spinner" id="loadingSpinner">
                    Chargement des statistiques...
                </div>
                <div class="career-filters" id="careerFilters" style="display: none;">
                    <div class="filter-group-career">
                        <label for="leagueFilter">Ligue</label>
                        <select id="leagueFilter" onchange="filterCareerStats()">
                            <option value="all">Toutes les ligues</option>
                            <option value="nhl">NHL seulement</option>
                            <option value="other">Autres ligues</option>
                        </select>
                    </div>
                    <div class="filter-group-career">
                        <label for="gameTypeFilter">Type de saison</label>
                        <select id="gameTypeFilter" onchange="filterCareerStats()">
                            <option value="all">Tous</option>
                            <option value="regular">Saison régulière</option>
                            <option value="playoffs">Playoffs</option>
                        </select>
                    </div>
                    <div class="stats-count-badge" id="statsCountBadge">
                        0 saisons affichées
                    </div>
                </div>
                <div id="careerStatsTable"></div>
            </div>
        </div>
    </div>

    <script defer src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script defer src="lazy-load.js"></script>
    <script defer src="avatars.js"></script>
    <script defer src="lib/scoring.js"></script>
    <script src="headshots.js"></script>
    <script defer src="injuries.js"></script>
    <script defer src="classement.js"></script>
    <script defer src="navbar.js"></script>
    <script defer src="poolNav.js"></script>
    <script defer src="notifications.js"></script>
</body>
</html>
